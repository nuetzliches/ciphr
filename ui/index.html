<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      No Content-Security-Policy here on purpose, and it is not missing from the
      deployment: `vite.config.ts` injects it into the built document, and `nginx.conf`
      sends it as a header. Both are checked in CI.

      It cannot live in this file. The dev server does not serve the built artifact — it
      assembles the page in the browser, and Vite's HMR client applies styles by creating
      elements at runtime, which `style-src 'self'` refuses. A policy here means a
      developer looking at an unstyled page and a console full of violations, and the fix
      someone reaches for is `unsafe-inline` in production. Keeping it out of the source
      document keeps it strict where it is served.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ciphr — viewer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
