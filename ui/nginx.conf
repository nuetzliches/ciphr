# The viewer's server block.
#
# This container serves files and nothing else. It does not proxy /v1: the reverse
# proxy in front routes / here and /v1 to the service, which is what makes the
# viewer same-origin with the API (plan section 15) and is why the page's
# Content-Security-Policy can say `connect-src 'self'`. A proxy_pass here would
# put a second, undocumented route to the secret service inside a container whose
# job is HTML.

server {
    # The unprivileged image runs as UID 101, so the port is above 1024 and no
    # capability has to be granted to bind it.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx would otherwise advertise its exact version on every response and in
    # every error page. It buys an attacker a version check for free.
    server_tokens off;

    # The same policy as the meta tag in index.html. The two must not drift: the
    # header is what a browser enforces first, the meta tag is what survives if
    # this bundle is ever served by something else.
    #
    # `default-src 'none'` forces every fetch type to be named. There is no
    # 'unsafe-inline' and no 'unsafe-eval': the build emits no inline script and
    # no inline style, and Vue's runtime here compiles no templates at runtime.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # Framing is refused twice: `frame-ancestors` above for browsers that read the
    # policy, and this for anything that only knows the older header. A viewer
    # that can be framed can be clickjacked into revealing a value.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # No geolocation, camera, microphone, or clipboard access is used by this page.
    # Naming them denies them to anything that ends up embedded here by mistake.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), clipboard-read=(), clipboard-write=()" always;

    location / {
        # No SPA fallback rewrite. The viewer routes on the fragment, so every URL
        # it produces is this document; a catch-all rewrite would answer 200 for
        # paths that do not exist and hide typos in a deployment.
        try_files $uri $uri/ =404;

        # The document must not be cached: a stale index.html points at asset
        # names from an older build, which is a blank page after every deploy.
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Built assets carry a content hash in their name, so they are immutable and
    # cacheable. This is a bundle of markup and code, never a secret: values
    # arrive from the API at request time and are never built into a file.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # No service worker is shipped, and one must not be servable: a cached
    # response to a secret read is a secret without an expiry date.
    #
    # **The refusal is by request, not by filename.** A worker may be registered
    # from any same-origin URL -- `/assets/index-<hash>.js` would do -- so the two
    # `location` blocks below cannot make registration impossible, and the security
    # table in `docs/ui.md` used to claim otherwise (finding F4, 2026-08-21). A
    # browser fetching a script *in order to register it* sends `Service-Worker:
    # script`, which is a property of the request rather than of the path, so this
    # refuses every registration attempt against this origin whatever the script is
    # called.
    #
    # What it cannot do is help against a worker that is already installed: that one
    # needs no fetch to keep controlling a page. `src/main.ts` is the half that
    # covers it, by refusing to mount while this document is controlled.
    if ($http_service_worker = "script") {
        return 404;
    }

    # Kept beside it: the conventional names, refused for a browser that does not
    # send the header and so that a file dropped into the image by accident cannot
    # become one.
    location = /service-worker.js {
        return 404;
    }
    location = /sw.js {
        return 404;
    }

    # Nothing in this image needs a dotfile served, and a served .env or .git
    # directory is the oldest static-hosting mistake there is.
    location ~ /\. {
        deny all;
    }
}
