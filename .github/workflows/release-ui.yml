# Builds and publishes the viewer image, on its own cadence.
#
# Separate from release.yml because that separation is the third argument in
# ADR-11: an npm advisory or a layout fix must not force a new server image, and
# therefore must not force a restart of the one service in the deployment whose
# restart demands the most care. Two images, two tag namespaces, two release
# decisions.
#
# Tags are `ui-v*` (for example `ui-v0.1.0`), which is what keeps `v*` meaning
# the service. A tag that meant both would put us back where we started.
#
# Third-party actions are pinned to a commit hash rather than a tag, for the
# reason ci.yml gives: a tag can be moved. Two architectures since 2026-08-24,
# for the reason release.yml gives: a deployment on arm64 should not get a
# service and a wrapper and then a viewer it cannot start.
#
# **This is the single publisher of the viewer image since 2026-08-24.** There
# was a Forgejo counterpart, `.forgejo/workflows/build-ui-image.yml`, which built
# the image a second time into an internal registry because a private repository
# means a private GHCR package that the deployment host cannot pull. It was
# removed with the decision to build the images here and pull them from GHCR.
# **While this repository is private that package is private too**, so the host
# needs a credential that may read it -- which is a deployment-side arrangement,
# and the alternative to it is the repository going public.
name: Release the viewer

on:
  push:
    tags: ["ui-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-ui-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/ui

jobs:
  # The same gates as everything else. The viewer job in that workflow is the
  # one that matters here, and calling the whole thing keeps one definition of
  # "green" rather than a second, drifting copy.
  verify:
    name: Verify before publishing
    uses: ./.github/workflows/ci.yml

  version:
    name: Derive the version
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      release: ${{ steps.derive.outputs.release }}
    steps:
      - name: Derive the version
        id: derive
        env:
          # Through the environment, never into the script -- a ref name is chosen
          # by whoever can create a tag, and Git allows an apostrophe in one, which
          # would close the quote this used to sit in and make the rest syntax (F1
          # of the review of 2026-08-24). `ci/check-workflow-interpolation.sh`
          # refuses the shape rather than trusting anybody to remember it.
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/ui-v*)
              version="${REF#refs/tags/ui-v}"
              release=true
              ;;
            # A manual run has no tag. It still produces an image, but one that
            # cannot be mistaken for a release: no `latest`, and a name that says
            # where it came from.
            *)
              version="0.0.0-dev.${GITHUB_SHA::7}"
              release=false
              ;;
          esac

          if [ "$release" = "true" ] &&
             ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "refusing to publish from $REF: '$version' is not a X.Y.Z version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Two architectures since 2026-08-24, for the reason the service image has
  # them: a deployment that runs on arm64 should not get a service and a wrapper
  # and then a viewer it cannot start. Issue #4 explicitly did not ask for this
  # one *first* -- and it is not first, it is last.
  image:
    name: The viewer image (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build context is ui/ and nothing else: this image is static files and
      # a web server, and it has no business being able to see the crates.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ui
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ciphr-ui
            org.opencontainers.image.description=Read-only viewer for a ciphr deployment: audit trail, secret metadata, identities, policies, health.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-ui-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-ui-${{ matrix.arch }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-ui-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish the viewer image tag
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-ui-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IS_RELEASE: ${{ needs.version.outputs.release }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          tags="-t ${IMAGE}:${VERSION}"
          if [ "$IS_RELEASE" = "true" ]; then
            tags="$tags -t ${IMAGE}:latest"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)

      # A deployment pins the digest rather than the tag. The argument is weaker
      # here than for the service — this container holds nothing — but a viewer
      # that can be swapped under a signed-in human is still a place to paste a
      # token into, so it is pinned the same way.
      - name: Report the digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Published"
            echo ''
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
