# Builds and publishes the container image, and the one artefact that is not an
# image: the static `ciphr-run` wrapper, attached to the release as a file (ADR-14).
#
# Third-party actions are pinned to a commit hash rather than a tag, for the
# reason ci.yml gives: a tag can be moved. The comment after each hash records
# which release it was.
#
# **Two architectures since 2026-08-24** (issue #4). Every image is a manifest
# list over an amd64 and an arm64 build, each produced on a runner of that
# architecture and pushed by digest, with a merge job creating the tag. The
# comment that used to stand here said one architecture was on purpose and that a
# second one would be the moment to add the second build, the digest-merge step
# and a cache scope per architecture. That moment arrived from the outside rather
# than from a host in this deployment: `ciphr-run` is mounted into images this
# project does not own, so an arm64 runner picking up an amd64 binary is somebody
# else's failure, inside their container, while a service is starting.
#
# Native runners rather than qemu. Compiling Rust under emulation is an order of
# magnitude slower and puts the emulator inside the artefact everyone pulls.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # The asset names are not defined here any more. They are derived from the
  # target triple where they are produced -- `ci/build-wrapper.sh` and
  # `ci/build-ci-binary.sh` from `$TARGET`, the jobs below from the matrix leg --
  # because with two architectures a name written down once is a name that is
  # right about one of them. The triple was added to those names on 2026-08-21,
  # while amd64 was the only one, which is what made today an addition rather
  # than a rename (issue #4).

jobs:
  # The image is only built if the code that goes into it passes. Duplicating
  # the gates would let them drift; calling the CI workflow keeps one definition
  # of "green".
  verify:
    name: Verify before publishing
    uses: ./.github/workflows/ci.yml

  # The version, derived once. Four jobs below need it, and deriving it four
  # times is four places for a manual run to become a release by accident.
  version:
    name: Derive the version
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      release: ${{ steps.derive.outputs.release }}
    steps:
      - name: Derive the version
        id: derive
        env:
          # **Through the environment, never into the script.** A `${{ … }}` inside
          # a `run:` block is substituted before the shell parses it, so the value
          # becomes program text and shell quotes do not escape it. A ref name is
          # chosen by whoever can create a tag, and Git accepts an apostrophe in
          # one -- so the old `ref='${{ github.ref }}'` handed a repository writer
          # a shell in a job that holds package-write credentials (F1 of the review
          # of 2026-08-24). `ci/check-workflow-interpolation.sh` is the gate.
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*)
              version="${REF#refs/tags/v}"
              release=true
              ;;
            # A manual run has no tag. It still produces images, but ones that
            # cannot be mistaken for a release: no `latest`, no release assets,
            # and a name that says where it came from.
            *)
              version="0.0.0-dev.${GITHUB_SHA::7}"
              release=false
              ;;
          esac

          # And then validated, because "it came from a tag" is not a shape. This
          # is defence in depth rather than the fix -- the value is data by the
          # time it gets here -- but a version is written into image tags, asset
          # names and a step summary, and every one of those has an opinion about
          # what a version looks like.
          if [ "$release" = "true" ] &&
             ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "refusing to publish from $REF: '$version' is not a X.Y.Z version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # ── Both images, once per architecture, pushed by digest ─────────────────────
  #
  # The pattern is one build per architecture on a native runner, each pushed
  # *by digest* with no tag, and a merge job afterwards that creates the tag as a
  # manifest list over those digests. The alternative -- one runner, two
  # platforms, qemu -- compiles Rust under emulation, which is an order of
  # magnitude slower and puts the emulator inside the artefact everybody pulls.
  #
  # The pre-flight build that used to sit here is gone: `verify` calls `ci.yml`,
  # and that workflow builds both files on both architectures on every pull
  # request now. The gate `v0.6.0` needed -- a release must not publish one image
  # and then fail to build the other -- moved earlier and got wider rather than
  # being dropped.
  image:
    name: The service image (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ciphr
            org.opencontainers.image.description=Secret manager for machine identities: KV secrets, gap-free access auditing, path-based authorization.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      # The digest as a filename, which is all the merge job needs: a set of
      # digests to point one tag at.
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-image-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Publish the service image tag
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-image-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag over both digests. `:latest` only for a real tag -- a manual run
      # publishes something pullable and nothing that moves a name a deployment
      # follows.
      - name: Create the manifest list
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IS_RELEASE: ${{ needs.version.outputs.release }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          tags="-t ${IMAGE}:${VERSION}"
          if [ "$IS_RELEASE" = "true" ]; then
            tags="$tags -t ${IMAGE}:latest"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)

      # What was published, by digest. A deployment pins the digest rather than
      # the tag: a tag is a name that can be moved, and this is the one image in
      # the fleet that reads every secret in it. The digest below is the manifest
      # list, which is what a `docker pull` on either architecture resolves.
      - name: Report the digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Published"
            echo ''
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "$digest"
            echo '```'
            echo ''
            echo 'Architectures:'
            echo ''
            echo '```'
            docker buildx imagetools inspect "${IMAGE}:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The artefact that is not a service. `ciphr-run` is bind-mounted into images
  # this project does not own (ADR-14), so a deployment needs the file, not
  # something to run -- and the architecture of that file is decided by whoever
  # mounts it, which is why both exist (issue #4).
  wrapper-image:
    name: The wrapper image (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build runs `ci/build-wrapper.sh` inside the builder stage, so the
      # linkage check and the size budget apply to the file that actually ships
      # -- the same script CI runs, and since 2026-08-24 with the budget for this
      # architecture rather than one number for both.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.run
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ciphr-run
            org.opencontainers.image.description=The static entrypoint wrapper from ADR-14, as the only file in its image.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }}/run,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=wrapper-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wrapper-${{ matrix.arch }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-wrapper-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # No `:latest`, deliberately, and not for the reason the service image has one.
  # A deployment pins this file by checksum; a moving tag for it would be a way to
  # change the bytes that get mounted into a foreign container with nothing
  # recording that it happened.
  wrapper-manifest:
    name: Publish the wrapper image tag
    needs: [version, wrapper-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-wrapper-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}/run
        run: |
          set -euo pipefail
          cd /tmp/digests
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" $(printf "${IMAGE}@sha256:%s " *)

  # The release, created once. Two jobs attach files to it, and two jobs racing
  # to create it is how a release ends up existing twice or not at all.
  release-shell:
    name: The release exists
    needs: version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create it if it is not there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  # Both wrapper binaries, taken out of the images that were just published.
  #
  # By digest and by platform, pulled back rather than read out of a local build:
  # buildx pushed straight from its own container, so this fetches what the
  # registry now serves. That makes the checksums a statement about the published
  # images rather than about builds that happened to precede them -- and these are
  # the commands the documentation tells a deployment to run, so the retrieval
  # path is exercised on every release rather than the first time somebody needs
  # it.
  #
  # One runner for both architectures: `docker create` does not start the
  # container, so pulling a foreign-architecture image to copy one file out of it
  # needs no emulation.
  wrapper-assets:
    name: Attach the wrapper binaries
    needs: [version, wrapper-manifest, release-shell]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Take the binaries out of the images that were published
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}/run
        run: |
          set -euo pipefail
          mkdir -p target/wrapper
          for pair in "linux/amd64 x86_64-unknown-linux-musl" "linux/arm64 aarch64-unknown-linux-musl"; do
            set -- $pair
            platform="$1"
            triple="$2"
            name="ciphr-run-${triple}"
            container="export-${triple}"
            docker create --platform "$platform" --name "$container" "${IMAGE}:${VERSION}"
            docker cp "${container}:/ciphr-run" "target/wrapper/${name}"
            docker rm "$container"
            (cd target/wrapper && sha256sum "$name" > "${name}.sha256")
          done

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" target/wrapper/ciphr-run-* --clobber

      # What a deployment has to check before mounting a file, and where it can
      # get it from. Printed here so both are in the run's own record, not only
      # inside the uploaded file.
      - name: Report the checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}/run
        run: |
          set -euo pipefail
          {
            echo "### The wrapper"
            echo ''
            echo '```'
            echo "${IMAGE}:${VERSION}"
            cat target/wrapper/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The CI-side binary (ADR-25): a release asset and no image, because a job
  # always holds a credential for the forge it runs on. Built on a runner of each
  # architecture rather than extracted from an image, since there is no image
  # here to extract from.
  ci-binary:
    name: The CI binary (${{ matrix.arch }})
    needs: [version, release-shell]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One at a time: both legs upload to the same release, and `gh release
      # upload` on two runners at once is a race nobody needs for two files.
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Add the musl target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build it, verify linkage, and check the budget
        env:
          TARGET: ${{ matrix.target }}
        run: sh ci/build-ci-binary.sh target/ci

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "target/ci/ciphr-ci-$TARGET" \
            "target/ci/ciphr-ci-$TARGET.sha256" \
            --clobber

      # The number a workflow passes to the action as `sha256-amd64` or
      # `sha256-arm64`. Printed into the run's own record, because that is where
      # somebody writing a workflow looks for it -- and because a checksum that
      # only exists inside the file it describes is a checksum nobody can use
      # before downloading.
      - name: Report the checksum
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          {
            echo "### The CI binary ($ARCH)"
            echo ''
            echo '```'
            cat "target/ci/ciphr-ci-$TARGET.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
