# Builds and publishes the container image, and the one artefact that is not an
# image: the static `ciphr-run` wrapper, attached to the release as a file (ADR-14).
#
# Third-party actions are pinned to a commit hash rather than a tag, for the
# reason ci.yml gives: a tag can be moved. The comment after each hash records
# which release it was.
#
# **Single architecture, on purpose.** This image runs on one amd64 host. A
# multi-arch manifest would mean a second build, a digest-merge step and a cache
# scope per architecture, all to produce an artifact nothing pulls. If a second
# architecture ever appears, that is the moment to add it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # The release asset's name, defined once because three steps below reach for
  # it. It carries the target triple while there is still only one target: this
  # asset is what a fetch script is written against, so a second architecture
  # must not force a choice between renaming it -- breaking those scripts -- and
  # publishing a qualified binary beside an unqualified checksum.
  # `ci/build-wrapper.sh` derives the same name from its `$TARGET`, and the CI
  # artifact in `ci.yml` has always been spelled this way.
  WRAPPER_ASSET: ciphr-run-x86_64-unknown-linux-musl

jobs:
  # The image is only built if the code that goes into it passes. Duplicating
  # the gates would let them drift; calling the CI workflow keeps one definition
  # of "green".
  verify:
    name: Verify before publishing
    uses: ./.github/workflows/ci.yml

  # The gate `v0.6.0` did not have. That release published its server image and
  # moved `:latest` to it, then failed to build `Dockerfile.run` -- the asset
  # rename in `1f82928` had left it copying a path the build no longer produces --
  # so one version existed as one image and not as the other, and the tag could
  # not be rebuilt without overwriting a digest somebody may already have pinned.
  #
  # Nothing caught it because nothing builds that file except a release, and the
  # two publishing jobs below have no reason to wait for each other: they both
  # hang off `verify` and run in parallel. This one builds the wrapper image and
  # pushes nothing, and both of them wait for it -- so a wrapper that cannot be
  # built now costs a failed release rather than half a published one, which is
  # the difference between an inconvenience and a version that means two things.
  #
  # Deliberately *not* the same thing as building this file on every push. That is
  # the more thorough answer, and `0.6.1`'s changelog priced it and declined: it
  # doubles a CI job on every commit for a file that changes rarely. This runs
  # only on a release, and the job that publishes the same image afterwards reads
  # the same `scope=wrapper` cache, so the second build is a cache hit and not a
  # second compile. Asked for in `docs/field-report-2026-08-22.md`, finding 5.
  wrapper-image:
    name: The wrapper image builds before anything is published
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # No registry login and no `push:`, so this job needs none of the
      # credentials the two after it hold. The build is the whole assertion.
      - name: Build it and publish nothing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.run
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=wrapper
          cache-to: type=gha,mode=max,scope=wrapper

  image:
    name: Build and publish
    needs: [verify, wrapper-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Derive the version
        id: version
        run: |
          set -euo pipefail
          ref='${{ github.ref }}'
          case "$ref" in
            refs/tags/v*) version="${ref#refs/tags/v}" ;;
            # A manual run has no tag. It still produces an image, but one that
            # cannot be mistaken for a release: no `latest`, and a name that
            # says where it came from.
            *)            version="0.0.0-dev.${GITHUB_SHA::7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.release == 'true' && format('{0}:latest', env.REGISTRY_IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ciphr
            org.opencontainers.image.description=Secret manager for machine identities: KV secrets, gap-free access auditing, path-based authorization.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      # What was published, by digest. A deployment pins the digest rather than
      # the tag: a tag is a name that can be moved, and this is the one image in
      # the fleet that reads every secret in it.
      - name: Report the digest
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }}' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The artefact that is not a service. `ciphr-run` is bind-mounted into images
  # this project does not own (ADR-14), so a deployment needs the file itself --
  # there is nothing to run.
  #
  # It goes out twice, and the second one is not redundancy. A release asset is
  # the right home for a file, and it is readable only by something that can
  # authenticate to GitHub; while this repository is private, that is a person
  # with a token and not the host that has to mount the file. `Dockerfile.run`
  # exists so the wrapper reaches that host through the registry the server image
  # already uses, and the file the release carries is extracted from the image
  # that was pushed, so the two cannot disagree about what they contain.
  wrapper:
    name: Publish the static wrapper
    needs: [verify, wrapper-image]
    # A manual run publishes no image tag and gets no release either; there is no
    # release to attach a file to.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # `contents` to attach the file to the release -- this is the only job in
      # either workflow that writes anything to the repository, and what it
      # writes is two release assets. `packages` for the image that carries the
      # same bytes to a deployment that cannot read a release asset at all.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Derive the version
        id: version
        run: |
          set -euo pipefail
          version='${{ github.ref_name }}'
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build runs `ci/build-wrapper.sh` inside the builder stage, so the
      # linkage check and the size budget apply to the file that actually ships
      # -- the same script CI runs, in one place rather than duplicated here.
      #
      # No `:latest`, deliberately, and not for the reason the server image has
      # one. A deployment pins this file by checksum; a moving tag for it would
      # be a way to change the bytes that get mounted into a foreign container
      # without anything recording that it happened.
      - name: Build and push the wrapper image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.run
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}/run:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ciphr-run
            org.opencontainers.image.description=The static entrypoint wrapper from ADR-14, as the only file in its image.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=wrapper
          cache-to: type=gha,mode=max,scope=wrapper

      # By digest, not by tag, and pulled back rather than read out of a local
      # build: buildx pushed straight from its own container, so this actually
      # fetches what the registry now serves. That makes the checksum below a
      # statement about the published image and not about a build that happened
      # to precede it.
      #
      # These are also the three commands the documentation tells a deployment to
      # run, which is the point -- the retrieval path is exercised on every
      # release rather than the first time somebody needs it.
      - name: Take the binary out of the image that was published
        run: |
          set -euo pipefail
          ref='${{ env.REGISTRY_IMAGE }}/run@${{ steps.build.outputs.digest }}'
          mkdir -p target/wrapper
          docker create --name ciphr-run-export "$ref"
          docker cp ciphr-run-export:/ciphr-run "target/wrapper/$WRAPPER_ASSET"
          docker rm ciphr-run-export
          (cd target/wrapper && sha256sum "$WRAPPER_ASSET" > "$WRAPPER_ASSET.sha256")

      # `gh` is preinstalled on the runner and authenticates with the job's token,
      # so this needs no additional third-party action to pin.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            "target/wrapper/$WRAPPER_ASSET" \
            "target/wrapper/$WRAPPER_ASSET.sha256" \
            --clobber

      # What a deployment has to check before mounting it, and where it can get
      # it from. Printed here so both are in the run's own record, not only
      # inside the uploaded file.
      - name: Report the checksum
        run: |
          {
            echo "### The wrapper"
            echo ''
            echo '```'
            echo "${{ env.REGISTRY_IMAGE }}/run:${{ steps.version.outputs.version }}"
            echo "${{ steps.build.outputs.digest }}"
            cat "target/wrapper/$WRAPPER_ASSET.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
