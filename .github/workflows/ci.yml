# Every gate in this workflow is blocking. A secret manager whose failures are
# silent needs its checks to be loud, so nothing here is advisory.
#
# Third-party actions are pinned to a commit hash rather than a tag, because a
# tag can be moved. The comment after each hash records which release it was.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable from release.yml, so the gates have one definition rather than two
  # that can drift. An image is only built from code that passed these.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The toolchain is pinned in rust-toolchain.toml; rustup installs it,
      # including rustfmt and clippy, on the first cargo invocation.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: cargo fmt
        run: cargo fmt --all --check

      # Two configurations, and ADR-20 says which two: everything off, and everything
      # on. With one surface entry those are the whole matrix -- "each entry alone" and
      # "everything on" are the same build while n is 1, and the rule is written down so
      # that the second entry does not have to invent it.
      #
      # `--all-features` came first here and was, until 2026-08-21, the only one. That
      # left the configuration a deployment actually receives untested: the default
      # build is what ships, and `honeypot_alert` is absent from it. The tests that
      # assert what a build *without* the entry does -- that bait is recorded as an
      # ordinary rejected credential, that `/v1/health` omits the tripwire fields
      # rather than reporting `false` -- are `#[cfg(not(feature = ...))]` and could not
      # run at all.
      - name: cargo clippy (default build, no surface entries)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test (default build, no surface entries)
        run: cargo test --workspace --locked

      - name: cargo clippy (every surface entry on)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test (every surface entry on)
        run: cargo test --workspace --all-features --locked

      # Source rules from the security guidelines. They are gates rather than
      # review habits because habits erode and gates do not.
      - name: No output from library crates
        run: sh ci/check-no-print.sh

      - name: forbid(unsafe_code) in every crate root
        run: sh ci/check-forbid-unsafe.sh

      # F1 of the review of 2026-08-24. A `${{ … }}` inside a `run:` block is
      # substituted before the shell parses it, so a ref name -- which whoever can
      # create a tag chooses, apostrophes and all -- becomes program text in a job
      # that holds package-write credentials.
      - name: No workflow expression reaches a shell script
        run: sh ci/check-workflow-interpolation.sh

      - name: No raw HTML injection in the UI
        run: sh ci/check-no-v-html.sh

      # ADR-20 property 1, and the gate that record says arrives with the first
      # surface entry rather than before it. `honeypot_alert` is that entry. What
      # it protects is the meaning of the external review: three crates read end
      # to end is a claim about the code every build runs, and a `cfg(feature)`
      # in one of them turns it into a claim about one configuration.
      - name: The reviewed core declares no features and reaches no surface
        run: sh ci/check-core-no-features.sh

      # The other half of the entry list. `ciphr surface show` prints the entries a
      # configuration named *and* the ones it did not, and that second list is the
      # only place an operator can read what a deployment chose not to turn on --
      # an entry off is absent from the router and so indistinguishable on the wire
      # from a path that never existed. The CLI's copy of the list is what prints
      # it, so a name missing there is a silent behaviour bug.
      - name: The CLI knows every surface entry the server does
        run: sh ci/check-surface-entries.sh

      # Invisible from inside the workspace: every crate here can already reach
      # `ciphr-core`, so a `ciphr-sdk` signature naming a core type that the crate
      # does not re-export compiles fine and only breaks for a consumer -- who
      # then needs a second dependency and has to keep the two versions in step by
      # hand. Route C is the reason this crate exists; a client that is awkward to
      # depend on is one an application does not use.
      - name: A consumer of ciphr-sdk needs no second dependency
        run: sh ci/check-sdk-reexports.sh

      # Static, and in this job rather than the viewer's, because it needs
      # neither Node nor a build -- it compares the package against the image's
      # COPY list. The bug it exists for shipped for three viewer releases: the
      # favicon was committed and referenced and no image contained it, because
      # CI builds from the whole tree and the image builds from the list.
      - name: The viewer image contains what the package has
        run: sh ci/check-ui-image-files.sh

      # Cannot check whether a document is accurate; can check that a reader is
      # able to judge how old it is.
      - name: Documentation carries dates
        run: sh ci/check-docs.sh

      # The narrow, checkable half of "documentation is about what exists". A
      # prose claim about a capability is beyond a script -- ADR-7 promised a
      # `VACUUM INTO` backup for three releases with no command behind it -- but a
      # code block handing somebody a subcommand that does not exist is not.
      - name: Documented commands exist
        run: sh ci/check-doc-commands.sh

      # The other half of "the index tells a reader what exists": that it is
      # complete. Ten documents were reachable from no index at `6feceb5`,
      # including the one page describing an unimplemented procedure, and three
      # sources disagreed about how many ADRs there are. Reachability is
      # mechanical; whether the sentence next to the link is *true* is still a
      # human's job, and this does not pretend otherwise.
      - name: Every document is in an index
        run: sh ci/check-doc-index.sh

      # And one level down: that the links themselves land. The move that came
      # with the index gate left one target pointing at nothing and eight link
      # texts naming a path that no longer existed -- neither catchable by
      # reading the diff, since the first is one unchanged line among ten changed
      # ones and the second looks correct from either half of the link alone.
      - name: Relative links land where they say
        run: sh ci/check-doc-links.sh

      # The changelog's release bookkeeping, which nothing noticed was missing:
      # the commit that tagged `0.5.1` never added its compare link, and a later
      # commit deleted the heading itself while inserting entries at that
      # position. This runs on a tag push too -- unlike the range gates in the
      # job below, which a tag deliberately skips -- because "does the version in
      # this tree have a section of its own" is exactly the question a release
      # asks.
      - name: The released version has its own changelog section
        run: sh ci/check-changelog-releases.sh

      # The gates above are shell scripts, and until 2026-08-20 nothing checked
      # them. That is the wrong way round: they are what enforces every other
      # rule here, so a defect in one silently stops enforcing something. Two of
      # them were using a `test` operator POSIX leaves undefined, found by
      # running this by hand. `shellcheck` is preinstalled on the runner image;
      # if that ever stops being true this step fails loudly rather than
      # skipping.
      - name: The gates themselves are valid shell
        run: shellcheck ci/*.sh

  # The viewer is its own package with its own toolchain and its own budget
  # (ADR-11, plan section 15), so it is its own job. A UI change that breaks the
  # bundle must not be reported as a Rust failure, and a Rust change must not
  # wait for npm.
  ui:
    name: Viewer build and dependency budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Pinned exactly, for the reason rust-toolchain.toml pins the compiler: a
      # floating toolchain lets CI go red without a code change, and a gate
      # nobody trusts is a gate nobody reads. A bump is a deliberate commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci` refuses to update the lockfile, and `--ignore-scripts` keeps a
      # dependency from running arbitrary code during install. The budget gate
      # below fails if a package that needs an install script ever arrives, so
      # this cannot silently start being wrong.
      - name: Install exactly the locked tree
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency budget
        run: sh ci/check-ui-budget.sh

      # The same allow list `cargo deny` applies to the crates, read out of
      # deny.toml rather than copied. Here rather than in the supply-chain job
      # because a lockfile records no licenses: they have to be read from the
      # installed tree, and this is the job that installs it.
      - name: License policy
        run: sh ci/check-npm-licenses.sh ui

      # The image generates this in its own build; running it here means a package
      # that ships no license text fails the pull request rather than the release.
      - name: Third-party notices
        working-directory: ui
        run: npm run notices

      # Type check and build in one step, the same script the image build runs,
      # so an image cannot be produced from code that does not type check.
      - name: Type check and build
        working-directory: ui
        run: npm run build

      # The bundle must stay servable under the policy the container sends, and it
      # must carry that policy itself: a bundle served by anything other than this
      # project's container would otherwise lose it silently. Both are checked
      # against the built document, because that is what a deployment serves — the
      # dev server assembles the page in the browser and is deliberately without a
      # policy (see vite.config.ts).
      - name: The built bundle carries the policy and no inline script or style
        working-directory: ui
        run: |
          set -eu
          # The policy attribute itself, not the file: the document carries comments
          # that name the keywords this must refuse, and a grep over the whole file
          # would read the explanation as the thing it warns about.
          policy=$(grep -o 'http-equiv="Content-Security-Policy" content="[^"]*"' dist/index.html | head -1)
          if [ -z "$policy" ]; then
            echo >&2 "dist/index.html carries no Content-Security-Policy: the build plugin is gone"
            exit 1
          fi
          for directive in "default-src &#39;none&#39;" "script-src &#39;self&#39;" "connect-src &#39;self&#39;"; do
            case "$policy" in
              *"$directive"*) ;;
              *) echo >&2 "the policy is missing: $directive"; exit 1 ;;
            esac
          done
          case "$policy" in
            *unsafe-inline* | *unsafe-eval*)
              echo >&2 "the policy has been weakened with an unsafe- keyword: $policy"
              exit 1
              ;;
          esac
          if grep -nE '<script[^>]*>[^<[:space:]]' dist/index.html; then
            echo >&2 "an inline script in dist/index.html would need 'unsafe-inline' in the CSP"
            exit 1
          fi
          if grep -rnE '<style|style="' dist/index.html; then
            echo >&2 "an inline style in dist/index.html would need 'unsafe-inline' in the CSP"
            exit 1
          fi
          # Every local reference in the document resolves to a file the bundle
          # actually has. The checks above say the document is safe to serve;
          # this says it is complete. A `href` that 404s violates no policy, so
          # nothing above can see it, and the browser reports it only in a
          # console nobody has open.
          #
          # This does not cover a file missing from the *image* -- the bundle
          # here is built from the whole tree, the image from a COPY list, and
          # comparing those two is what ci/check-ui-image-files.sh does.
          refs=$(grep -oE '(href|src)="[^"]*"' dist/index.html |
                   sed -e 's/^[^"]*"//' -e 's/"$//')
          for ref in $refs; do
            case "$ref" in
              '' | http:* | https:* | //* | data:* | mailto:* | '#'*) continue ;;
            esac
            path=${ref%%\?*}
            path=${path%%#*}
            if [ ! -f "dist/${path#/}" ]; then
              echo >&2 "dist/index.html references $ref, which the bundle does not contain"
              exit 1
            fi
          done
          echo "policy present, nothing inline, every reference resolves"

      # Advisories for the frontend tree, separate from cargo-audit. High and
      # above fails: the viewer runs in a tab that may hold a plaintext secret.
      - name: npm audit
        working-directory: ui
        run: npm audit --audit-level=high

  # The site's code blocks are coloured by a tool rather than by a script on the
  # page, so the generated markup lives in the tree and can go stale or be edited
  # by hand — both silently. Its own job, for the reason the viewer has one: this
  # needs npm, and a Rust change must not wait for it.
  #
  # Deliberately *not* part of pages.yml. That workflow uploads `site/` exactly as
  # it is and says there is no build step in the publish path; keeping the check
  # here means a stale page fails review rather than failing a deployment.
  site:
    name: The site's code blocks are what the highlighter produces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: ci/site-highlight/package-lock.json

      - name: Install exactly the locked tree
        working-directory: ci/site-highlight
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Before the highlighter runs, so a tree that should not have been installed
      # is reported as a budget failure rather than as a stale page.
      - name: Dependency budget
        run: sh ci/check-site-highlight-budget.sh

      - name: License policy
        run: sh ci/check-npm-licenses.sh ci/site-highlight

      - name: The markup in the tree is what the mapping produces
        run: sh ci/check-site-highlighting.sh

      - name: npm audit
        working-directory: ci/site-highlight
        run: npm audit --audit-level=high

  changelog:
    name: Shipped code and documentation carry their record
    # A tag rebuilds code that already passed this gate on main, and the range a
    # tag push reports is the tag's own history rather than a change under
    # review. Checking it there would fail a release for a commit that was
    # already judged.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The gate reads a range of commits, so the default shallow clone is
          # not enough. Full history rather than a guessed depth: any number
          # here would be an assumption about how many commits a push contains,
          # and the gate would silently degrade to checking the tip when the
          # assumption was wrong.
          fetch-depth: 0

      # The rule CHANGELOG.md states about itself. It is a gate for the same
      # reason the source rules above are: the one documentation discipline that
      # was left to habit is the one that eroded.
      - name: Changelog entry for changes under crates/
        env:
          # A pull request is reviewed as base..head. A push reports the commit
          # the branch moved from, which is the same question asked of a
          # different event.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh ci/check-changelog.sh "$BASE" "$HEAD_SHA"

      # Same range, a different claim: `check-docs.sh` in the job above asks
      # whether a document carries a date at all, which cannot catch the failure
      # that actually happens -- a document is edited and the date at the top
      # stays where it was. This one asks whether a document that changed still
      # claims to be current as of a day before the change.
      - name: Documentation that changed says so in its status line
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh ci/check-doc-dates.sh "$BASE" "$HEAD_SHA"

  supply-chain:
    name: Licenses, advisories, dependency budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Upstream release binaries, pinned by version and SHA-256. Compiling both
      # tools from source cost 8m47s per cold run and needed a cache to hide it;
      # this takes seconds and verifies more than `cargo install` does. Versions
      # and hashes live in the script, and a bump changes both together.
      - name: Install pinned supply-chain tools
        run: sh ci/install-supply-chain-tools.sh

      # Licenses, advisories, banned and duplicate crates, and source registries.
      - name: cargo deny
        run: cargo deny check

      # Overlaps with `cargo deny check advisories` on purpose: two independent
      # tools reading the same advisory database catch each other's outages, and
      # this one fails on a stale or unreachable database rather than skipping.
      - name: cargo audit
        run: cargo audit --deny warnings

      # The other half of the licensing question. `cargo deny` answers whether a
      # license may be used; this answers whether the artefacts carry the notices
      # those licenses require, and it fails on a crate that ships no text rather
      # than inventing one. The release attaches the file and both images contain
      # it, so generating it has to be something a pull request can break.
      - name: Third-party notices
        run: sh ci/build-notices.sh

  # ── The two static binaries, once per architecture ───────────────────────────
  #
  # `ciphr-run` is bind-mounted into images this project does not own (ADR-14) and
  # `ciphr-ci` is downloaded onto whatever a runner happens to be (ADR-25). For
  # both, the architecture is decided by somebody else's machine, which is why
  # issue #4 called this half the one with an *external* trigger: the first arm64
  # runner that mounts an amd64 wrapper gets `exec format error` from inside a
  # foreign container, at the moment a service is starting without its secrets.
  #
  # **Native runners, not emulation.** The tests below run the binaries *as*
  # static musl executables rather than only building them, because static musl is
  # exactly where name resolution breaks -- NSS modules cannot be loaded into a
  # static binary -- and a build-only gate would not notice. Under qemu that
  # assertion would be about the emulator as much as about the binary, and the
  # scripts also strip and `ldd` the result with the host's tools, which do not
  # read a foreign ELF.
  binaries:
    name: Static binaries (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both legs run to completion. One architecture failing is a fact about that
      # architecture, and cancelling the other one hides whether it was too.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Add the musl target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # `tests/wrapper.rs` covers the real exec path and one resolution by name.
      - name: Test the wrapper as a static binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked -p ciphr-run --target "$TARGET"

      # Verifies static linkage and holds the binary to a size budget. The budget
      # is a review trigger rather than a performance one: a jump means a new
      # dependency arrived in the thing mounted into other people's containers.
      # It is per target, because an aarch64 binary is a different size for
      # reasons that have nothing to do with dependencies.
      - name: Build the wrapper, verify linkage, and check the budget
        env:
          TARGET: ${{ matrix.target }}
        run: sh ci/build-wrapper.sh target/wrapper

      # Kept so that a deployment can take the exact file these gates passed on,
      # rather than rebuilding it and hoping. The release workflow attaches the
      # same artefact to a tag.
      - name: Keep the wrapper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ciphr-run-${{ matrix.target }}
          path: target/wrapper/
          if-no-files-found: error

      - name: Test the CI binary as a static binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked -p ciphr-ci --target "$TARGET"

      - name: Build the CI binary, verify linkage, and check the budget
        env:
          TARGET: ${{ matrix.target }}
        run: sh ci/build-ci-binary.sh target/ci

      - name: Keep the CI binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ciphr-ci-${{ matrix.target }}
          path: target/ci/
          if-no-files-found: error

  # The name the branch ruleset requires, kept stable across a matrix that will
  # grow again. A matrix leg reports as `Static binaries (arm64)`, so requiring
  # the legs by name would mean editing the ruleset every time the matrix changes
  # -- and a required check that no longer exists blocks every merge silently.
  # This job carries the required name and asserts the legs.
  #
  # `if: always()` with an explicit test, rather than a bare `needs:`: a job that
  # is *skipped* because its dependency failed never reports a conclusion, and a
  # required check that never reports is indistinguishable from one still running.
  wrapper:
    name: The static binaries build, run, and fit their budgets
    needs: binaries
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every architecture built, ran and fitted
        env:
          RESULT: ${{ needs.binaries.result }}
        run: |
          set -eu
          if [ "$RESULT" != "success" ]; then
            echo "one or more architectures failed: $RESULT" >&2
            exit 1
          fi
          echo "amd64 and arm64 both built, ran their tests as static binaries, and fit their budgets"

  # ── The images build, on every architecture they are published for ───────────
  #
  # Nothing here built a `Dockerfile` until 2026-08-24. The release did, and only
  # the release -- so a change to either file was proven by publishing it, which
  # is how `v0.6.0` published one image and failed to build the other. That gate
  # exists in `release.yml` now for the wrapper, and this job is the same idea one
  # step earlier: both files, both architectures, on every pull request.
  #
  # Nothing is pushed. The assertion is that the images can be produced, which is
  # the half a release cannot recover from. Native runners rather than qemu: a
  # Rust build under emulation takes an order of magnitude longer, and the point
  # of this job is that somebody waits for it.
  images:
    name: Images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # The service image. Its runtime stage installs three exact package
      # versions from a Debian snapshot, and those versions have to exist for
      # this architecture -- a binNMU revision that differs per architecture
      # would fail here rather than during a release.
      - name: The service image builds
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      # The wrapper image, whose whole filesystem is one static binary. The
      # release builds this too, before it publishes anything; here it is proven
      # per architecture instead of only for the one the release runs on.
      - name: The wrapper image builds
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.run
          push: false
          cache-from: type=gha,scope=wrapper-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wrapper-${{ matrix.arch }}

  fuzz:
    name: Fuzz smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The one place a second toolchain is accepted: libFuzzer needs nightly, and
      # the path normalizer is where an unexpected input can make routing and
      # authorization disagree (ADR-9), so a real fuzzer is worth a real cost. The
      # nightly is pinned by date for the same reason 1.94.0 is pinned — a floating
      # toolchain would let CI go red without a code change, and a gate nobody
      # trusts is a gate nobody reads.
      - name: Install the pinned nightly toolchain
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal --no-self-update
          rustup run nightly-2026-08-01 rustc --version

      - name: Install pinned cargo-fuzz
        run: sh ci/install-fuzz-tools.sh

      # A smoke run, not a fuzzing campaign: enough to catch a target that no longer
      # builds or an invariant that breaks on trivial input. Finding deep bugs takes
      # hours and belongs in a scheduled run, which is a separate decision.
      #
      # `--target` is explicit because cargo-fuzz otherwise builds for its own host
      # triple, and the pinned binary is the musl build — the only one rust-fuzz
      # publishes for Linux. AddressSanitizer needs a dynamically linked libc, so a
      # musl target fails to build. Naming the target also makes the run reproducible
      # rather than dependent on how the tool was installed.
      - name: Fuzz path normalization
        run: cargo +nightly-2026-08-01 fuzz run --target x86_64-unknown-linux-gnu path_normalization -- -max_total_time=45 -rss_limit_mb=2048

      - name: Fuzz pattern matching
        run: cargo +nightly-2026-08-01 fuzz run --target x86_64-unknown-linux-gnu pattern_matching -- -max_total_time=45 -rss_limit_mb=2048

      - name: Fuzz policy file loading
        run: cargo +nightly-2026-08-01 fuzz run --target x86_64-unknown-linux-gnu policy_file -- -max_total_time=45 -rss_limit_mb=2048

      # A crash leaves an artifact behind; keep it, because a reproducer that only
      # existed inside a CI run is a bug report nobody can act on.
      - name: Keep any crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
