# The v1 HTTP API, as implemented.
#
# Maintained from phase 3 on, in the same commit as the code it describes. Two
# consumers depend on it being accurate rather than aspirational: the composite CI
# action, and the MCP server, which is derived from this file rather than written
# alongside it (ADR-13).
#
# Three paths are listed as reserved. None of them exists in v1 and all of them return
# 404; they are here so the names are not claimed for something else by accident when
# the features arrive: `POST /v1/auth/oidc/login` for OIDC federation (section 14 of
# the plan), and `POST /v1/report` with `GET /v1/leaks` for leak reports (section 23,
# ADR-16).
#
# **Seven routes are optional**, which is a third state beside "exists" and "reserved" and
# one this document could not express before 2026-08-21. Each belongs to a surface entry
# (ADR-20) and answers 404 where a deployment did not turn that entry on -- the same status
# a reserved path gives, for a different reason. `GET /v1/health` lists the entries a given
# instance has, which is how a client finds out rather than guessing from a status code.
#
#   `viewer_api`      GET /v1/audit, /v1/identities, /v1/policies
#   `bulk_export`     POST /v1/export
#   `token_status`    GET /v1/tokens
#   `token_revoke`    POST /v1/tokens/{token_id}/revoke
#   `honeypot_alert`  GET /v1/honeypots
#
# `token_revoke` is the only one of them that *writes*, and the only write in this
# document that is not about a secret: ADR-3 keeps administration off the API, and ADR-24
# narrows that to one named exception rather than repealing it.
#
# The first two were unconditional until 2026-08-21 and are a **breaking change** for a
# deployment that does not name them: see `docs/operations/upgrade.md`. They became entries
# because they were always optional in substance and not in mechanism -- the three viewer
# routes exist for a component that is already an optional container (ADR-11), and a
# deployment without the viewer was serving them to nobody while putting the policy
# structure and the identity inventory on the network for anyone holding any token.
#
# `POST /v1/report` is the reservation that matters beyond tidiness: it is the only
# route in the design that will ever be unauthenticated besides `/v1/health`.
openapi: 3.1.0

info:
  title: ciphr
  # Tracks the release, not the path prefix. The paths are `/v1/…` and that prefix is
  # stable; the product is 0.12.0, and calling this document 1.0.0 would claim a
  # stability guarantee that has not been earned. Two reasons now, the second of them
  # since `0.7.0`: the external review of the crypto and authorization crates
  # happened on 2026-08-21 and read three crates rather than this API — the server,
  # its configuration and its TLS setup are on that record's own list of what it did
  # not read — and the honeypot surface added afterwards is newer than that review's
  # acceptance, which `docs/security-review.md` marks where it stands.
  version: "0.12.0"
  summary: A secret manager for machine identities.
  description: |
    Key/value secrets, gap-free access auditing, and path-based authorization.

    **Every route except `/v1/health` requires a bearer token.** Authentication
    failures are always `401` with the same body, whatever was wrong with the
    credential; authorization failures are `403` and say nothing about the rule that
    refused. The rule is in the audit trail, where the operator can see it and the
    caller cannot.

    **Values are UTF-8 text.** A binary secret must be encoded by whoever stores it.
    There is deliberately no second representation: two of them would mean every
    client has to handle both, and the one that only handles text fails on the value
    it was never tested with.

    **Every response carries `Cache-Control: no-store`**, including the errors and the
    routes a deployment has turned off. A cached response to a secret read is a secret
    without an expiry date, and a client, proxy or private browser cache left with its
    defaults is a place one can end up. New in this version of the document; before it the
    server emitted no cache directive at all.

    **`503` means the audit trail could not be written.** No secret is served and no
    change is made in that case. A full audit volume is therefore an outage rather
    than a logging gap, which is intended and needs monitoring.

    The minimal client is `curl`. There is no agent, no plugin, and no forge
    integration required:

    ```sh
    curl --cacert "$CIPHR_CA" \
         -H "Authorization: Bearer $CIPHR_TOKEN" \
         "https://ciphr.internal:4400/v1/secrets/infra/service-a/DB_PASSWORD"
    ```

    `-k` and `--insecure` appear in no example here, not even for testing. TLS
    terminates at the listener (ADR-8), and the certificate or its pin is distributed
    as a non-secret CI variable.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0

servers:
  - url: https://{host}:{port}
    description: A ciphr instance. TLS is not optional.
    variables:
      host:
        default: localhost
      port:
        default: "4400"

security:
  - bearerToken: []

tags:
  - name: secrets
    description: Reading and writing values.
  - name: administration
    description: Read-only views. Writing identities or policies is not an API operation (ADR-3).
  - name: operations
    description: Health.

paths:
  /v1/health:
    get:
      tags: [operations]
      summary: Liveness, seal state, and audit device state.
      description: |
        The only route without authentication, and therefore the only one that
        deliberately reveals nothing: no inventory counts, no path names, and no
        indication of whether any secret exists.

        Seal state is included because an HTTP 200 alone cannot distinguish a healthy
        service from a sealed one that answers and can serve nothing.
      security: []
      responses:
        "200":
          description: The service is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/secrets/{path}:
    parameters:
      - $ref: "#/components/parameters/SecretPath"
    get:
      tags: [secrets]
      summary: Read a value.
      description: |
        Requires the `read` capability on the path. Produces exactly one audit entry.
      parameters:
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: The value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuditUnavailable" }
    put:
      tags: [secrets]
      summary: Write a new version.
      description: |
        Requires the `write` capability. Always creates a new version; nothing is
        overwritten, and the previous version stays readable.

        The audit entry is written **before** the store changes, so a failure to log
        leaves the store untouched. Paths under `sys/` are refused with `400`: that
        prefix names the virtual paths the administrative endpoints authorize against,
        and a secret living there would change what an authorization decision means.

        An optional `rotation` carries the class along with the value, so that importing
        an estate over the API does not have to leave every path `unclassified` until
        somebody stops the service to say otherwise. It produces a second audit entry,
        `classify`, beside the `write`.

        **The value and the class are one store transaction**, so this request either
        establishes both or neither. It used to commit the version and then set the
        class separately — justified by a class not being recordable for a path that
        does not exist yet, which is true between two transactions and false inside one.
        A failure in between left the value stored, the class unset and an error on the
        wire, and a retry wrote a second version of the same value. Both audit decisions
        are recorded before the write, and both get a correcting entry under the same
        request id if it fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretInput"
      responses:
        "200":
          description: The version that was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuditUnavailable" }
    delete:
      tags: [secrets]
      summary: Soft-delete a version.
      description: |
        Requires the `delete` capability. Reversible: the version is marked deleted and
        can be restored with the CLI.

        Irreversible destruction — crypto-shredding, which deletes the wrapped data key
        — is deliberately not an API operation. It happens through the CLI on the host
        (ADR-3).
      parameters:
        - $ref: "#/components/parameters/Version"
      responses:
        "204":
          description: The version is deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/versions/{path}:
    parameters:
      - $ref: "#/components/parameters/SecretPath"
    get:
      tags: [secrets]
      summary: The version history of one secret, without values.
      description: |
        Requires the `list` capability on the path.

        A separate prefix rather than `/v1/secrets/{path}/versions`, because with a
        catch-all route a secret named `foo/versions` would be indistinguishable from
        the version listing for `foo` — the routing-versus-policy divergence ADR-9
        warns about. Suffix parsing on catch-all routes is forbidden throughout.
      responses:
        "200":
          description: The rotation class, and the versions oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/list/{prefix}:
    parameters:
      - name: prefix
        in: path
        required: true
        description: The prefix to list under, without a leading or trailing slash.
        schema:
          type: string
          examples: ["infra/service-a"]
    get:
      tags: [secrets]
      summary: The paths under a prefix.
      description: |
        Every returned path is authorized individually against the `list` capability, so
        a caller sees exactly the names they may see. The operation itself needs only
        authentication.

        That is deliberate: a prefix is not a path anyone holds a rule about. `infra/**`
        grants `list` inside `infra` and not on `infra` itself, so authorizing the
        prefix would refuse the listing to an identity permitted to list everything
        under it. An empty array is what "you may list nothing here" looks like, and it
        is indistinguishable from "there is nothing here".

        Each path comes with its rotation class in `entries`, which is what makes *what
        has nobody classified yet?* answerable against a running service — the CLI can
        answer it too, but only with the service stopped, because it takes the exclusive
        store lock.
      parameters:
        - name: rotation
          in: query
          required: false
          description: |
            Return only paths in this class. Unknown classes are refused with `400`
            rather than matching nothing, because an empty listing looks like an answer.

            The filter runs **after** authorization, and the audit entry records the
            number of paths actually returned — what was revealed, not what the caller
            was entitled to see.
          schema:
            type: string
            examples: ["unclassified"]
      responses:
        "200":
          description: The visible paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/export:
    post:
      x-surface-entry: bulk_export
      tags: [secrets]
      summary: Several secrets in one call.
      description: |
        **Optional route**, belonging to the `bulk_export` surface entry (ADR-20). It
        answers `404` from the router's fallback where a deployment did not name that
        entry.

        **A consumer that reads through `ciphr-sdk` does not stop there** (since
        2026-08-24, ADR-25): `Client::read_all` falls back to one
        `GET /v1/secrets/{path}` per path, which is what route C was always documented as
        doing and is now what routes B and `ciphr-ci` do as well. Turning this entry on
        buys one request instead of one per path — worth it at container start for a
        service with many secrets — and nothing else. It is not a precondition for
        fetching, and it was one until that date: a deployment that had made no decision
        had a wrapper that exited 125 on a `404`.

        The trail does not notice the difference. This route writes one entry per secret
        served rather than one per call, so a fallback changes the number of requests and
        nothing about what is recorded. A **refusal** does differ: see below.

        Turning it off does **not** remove fetched prefixes, and an earlier version of
        this description said it did. This route reads the paths a caller *names* —
        `ExportRequest` has no prefix — so whether a prefix is covered is a property of
        the fetching code: a caller that lists `GET /v1/list/{prefix}`, which is not an
        entry, and then reads each path covers the same prefix with this route off. Where
        a honeypot secret has to sit is therefore settled by reading the consumer
        (ADR-15, and `docs/operations/honeypots.md`), not by this switch.

        Requires `read` on **every** path requested, and produces **one audit entry per
        secret served** — never one per call. A collective entry for a bulk read is
        exactly the blind spot that disqualified other candidates during the evaluation.

        One refusal fails the whole export rather than returning the permitted subset,
        so an export cannot be used to map which paths a caller may read. That property
        belongs to this route and not to the API: read one path at a time — which is what
        a client does where this entry is off — a `403` names the path it refused, and the
        paths fetched before it have been served and audited. Nothing is disclosed that
        `GET /v1/secrets/{path}` does not already answer for any token holder; what changes
        is that a partial fetch leaves a partial trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: The requested secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/audit:
    get:
      x-surface-entry: viewer_api
      tags: [administration]
      summary: Read the audit trail.
      description: |
        **Optional route**, belonging to the `viewer_api` surface entry (ADR-20). It
        answers `404` from the router's fallback where a deployment did not name that
        entry, and `GET /v1/health` lists the entries a given instance has. The CLI reads
        this from the store with no network hop, so turning the entry off costs the viewer
        and nothing else.

        Requires `inspect` on the virtual path `sys/audit`, through the ordinary policy
        evaluator. There is no `admin` capability and no second authorization
        mechanism.

        Each entry is returned as the exact stored record plus its hash, so a client can
        verify the chain itself rather than trusting this endpoint's word about it.
        Filters are applied server-side, because the alternative is a client pulling the
        whole trail to answer a question about part of it.

        **The trail does not necessarily begin at sequence 1.** `ciphr audit cut` bounds
        the queryable device, and what survives a cut chains to a record that is no
        longer in it. A client verifying from genesis fails on such a store, which is the
        correct outcome: the point the remainder starts from is deliberately not served
        here, because it is only worth anything as the anchor kept outside the store.
      parameters:
        - name: limit
          in: query
          description: Maximum entries to return. Clamped to 1000.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: after_seq
          in: query
          description: Only entries with a sequence number greater than this.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: since
          in: query
          description: Only entries at or after this time, in milliseconds since the Unix epoch.
          schema: { type: integer, format: int64 }
        - name: identity
          in: query
          description: Only entries for this identity.
          schema: { type: string }
        - name: path
          in: query
          description: Only entries for this exact path.
          schema: { type: string }
        - name: decision
          in: query
          description: Only allowed or only denied entries.
          schema: { type: string, enum: [allow, deny] }
      responses:
        "200":
          description: The matching entries, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: This deployment did not turn on the `viewer_api` entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/identities:
    get:
      x-surface-entry: viewer_api
      tags: [administration]
      summary: Which identities exist and which policies they hold.
      description: |
        **Optional route**, belonging to the `viewer_api` surface entry (ADR-20). It
        answers `404` from the router's fallback where a deployment did not name that
        entry, and `GET /v1/health` lists the entries a given instance has. The CLI reads
        this from the store with no network hop, so turning the entry off costs the viewer
        and nothing else.

        Requires `inspect` on `sys/identities`. Read-only: identities are defined in the policy
        file, which is authoritative (ADR-3). This endpoint makes misconfiguration
        visible without making it creatable.
      responses:
        "200":
          description: The identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identities"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: This deployment did not turn on the `viewer_api` entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/policies:
    get:
      x-surface-entry: viewer_api
      tags: [administration]
      summary: The rules, as loaded.
      description: |
        **Optional route**, belonging to the `viewer_api` surface entry (ADR-20). It
        answers `404` from the router's fallback where a deployment did not name that
        entry, and `GET /v1/health` lists the entries a given instance has. The CLI reads
        this from the store with no network hop, so turning the entry off costs the viewer
        and nothing else.

        Requires `inspect` on `sys/policies`. Includes each rule's specificity — the number of
        literal segments — because that is what decides between two matching rules, and
        a reader working out why an access was refused needs it.
      responses:
        "200":
          description: The policies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policies"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: This deployment did not turn on the `viewer_api` entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/tokens:
    get:
      x-surface-entry: token_status
      tags: [administration]
      summary: The token inventory, without any token in it.
      description: |
        **Optional route**, belonging to the `token_status` surface entry (ADR-20).
        Requires `inspect` on the virtual path `sys/tokens` (ADR-23).

        **What this adds is the authenticated answer, not the answer.** `ciphr token list`
        has read this from the store read-only since ADR-22, so expiry, revocation state
        and last use are already answerable with the service running. What the host path
        cannot do is name who asked: it records nothing, and its principal would be
        `cli:$USER`, self-declared. Here the caller is an authenticated identity and the
        read is in the trail.

        **No credential is in the response and nothing derived from one** — no verifier, no
        token. `state` is derived from the three timestamps beside it, in one place shared
        with the CLI, so the two cannot come to disagree about what `valid` means.

        `honeypot` marks bait (ADR-15). It appears on this path deliberately and on no
        path a presenter can reach: the deployment has to know which credential is bait,
        and whoever presents it must not be able to tell.

        `?identity=` narrows the listing, the same argument `ciphr token list` takes.
      parameters:
        - name: identity
          in: query
          required: false
          schema: { type: string }
          description: Only this identity's tokens.
      responses:
        "200":
          description: The inventory.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      required:
                        [token_id, identity, state, created_at, created_by, honeypot]
                      properties:
                        token_id:
                          type: string
                          description: The non-secret identifier. Never the token.
                        identity: { type: string }
                        state:
                          type: string
                          enum: [valid, expired, revoked]
                          description: |
                            Derived. `revoked` wins over `expired` when a token is both:
                            a revocation is something somebody did.
                        created_at:
                          type: integer
                          description: Milliseconds since the Unix epoch, UTC.
                        created_by: { type: string }
                        expires_at:
                          type: [integer, "null"]
                          description: Absent when the token does not expire.
                        last_used_at:
                          type: [integer, "null"]
                          description: Absent when it has never authenticated.
                        revoked_at:
                          type: [integer, "null"]
                        honeypot:
                          type: boolean
                          description: Bait (ADR-15). Authenticates nothing.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: This deployment did not turn on the `token_status` entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/tokens/{token_id}/revoke:
    parameters:
      - name: token_id
        in: path
        required: true
        schema: { type: string }
        description: |
          The token's non-secret identifier, as `ciphr token list` and the audit trail
          spell it. Never the token itself.
    post:
      x-surface-entry: token_revoke
      tags: [administration]
      summary: Revoke one token.
      description: |
        **Optional route**, belonging to the `token_revoke` surface entry (ADR-20), and
        **the only write this API may do** (ADR-24). It answers `404` from the router's
        fallback where a deployment did not name that entry, and `GET /v1/health` lists
        the entries a given instance has.

        Requires `revoke` on the virtual path `sys/tokens`. No secret capability reaches
        it and neither does `inspect`: revoking is not reading the inventory (ADR-23).

        **Why it exists.** `ciphr token revoke` takes the exclusive store lock the running
        server holds, so on the host the sequence is stop, revoke, start — an outage at the
        one moment nobody planned for. The server already checks revocation on every
        request, so only the path that writes the row was missing.

        **What stays outside it.** Issuing a token needs the master key and *creates* a
        credential, so it remains a host operation with a planned window. `revoke-all` for
        an identity remains one too: a single request that invalidates every credential of
        an identity is an availability weapon, and repeating this call has the same effect
        with one audit entry per token.

        **Idempotent.** A second call succeeds and reports `revoked_now: false`, leaving the
        original timestamp — so a retry after a network failure is safe.

        The audit entry names the authenticated caller as the principal and the revoked
        token as the subject, which is the same shape the CLI records for the same
        operation. **If the store write then fails**, a second entry records that outcome
        and the response is `503` -- the trail never claims a revocation that did not
        happen.
      responses:
        "200":
          description: The token is revoked. It authenticates nothing from its next request.
          content:
            application/json:
              schema:
                type: object
                required: [token_id, identity, revoked_now]
                properties:
                  token_id: { type: string }
                  identity:
                    type: string
                    description: Whose credential this was.
                  revoked_now:
                    type: boolean
                    description: |
                      True when this call revoked it, false when it already was. The
                      request succeeds either way.

                      Derived from the write itself, not from a read taken before it,
                      so two concurrent revocations of the same token cannot both
                      report true. Exactly one call established the timestamp and
                      exactly one is told so.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            No token with this identifier — or this deployment did not turn on the
            `token_revoke` entry. The two are deliberately the same status: whether a
            token id exists is not answerable without `revoke` on `sys/tokens`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/auth/oidc/login:
    post:
      tags: [administration]
      summary: Reserved. Not implemented in v1.
      description: |
        Reserved for OIDC federation, which is first on the post-v1 list: a CI job
        exchanges a forge-issued ID token for a short-lived ciphr token, and the
        long-lived bootstrap secret disappears.

        Listed here so the path is not claimed for something else by accident. It
        returns `404` in v1.
      security: []
      responses:
        "404":
          description: Not implemented in v1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/report:
    post:
      tags: [administration]
      summary: Reserved. Not implemented in v1.
      description: |
        Reserved for leak reports (plan section 23, ADR-16): an unauthenticated drop box
        that accepts a candidate secret value and, on a match, marks the version it
        matched as leaked.

        When it exists it will answer `202` with an empty body for a match and a miss
        alike, and `429` at a rate or size limit. It will never say whether the value
        matched — an endpoint without a credential may report what the process enforces
        and not what is stored, and an endpoint that confirms a guess is a guessing
        machine for any value with little entropy. Matches are visible on the
        authenticated side only, through `GET /v1/leaks` and the audit trail.

        Listed here so the path is not claimed for something else by accident, and
        because it is the only route besides `/v1/health` that will ever be
        unauthenticated. It returns `404` in v1.
      security: []
      responses:
        "404":
          description: Not implemented in v1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/leaks:
    get:
      tags: [administration]
      summary: Reserved. Not implemented in v1.
      description: |
        Reserved for the operator-facing half of leak reports (plan section 23, ADR-16):
        the versions a report has matched, when, and the reporter's note.

        Authorized as the virtual path `sys/leaks` through the ordinary policy
        evaluator, like `sys/audit` — there is no new capability. The mark it reports is
        metadata and influences no authorization decision, because a value anyone has
        seen must not become a value anyone can switch off.

        Listed here so the path is not claimed for something else by accident. It
        returns `404` in v1.
      responses:
        "404":
          description: Not implemented in v1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/surface:
    get:
      tags: [administration]
      summary: Which optional surface entries this deployment turned on, and why.
      description: |
        Requires `inspect` on the virtual path `sys/surface` (ADR-20). No new capability:
        the same evaluator and the same mechanism as `sys/audit`.

        Each entry carries the date the deployment accepted the cost, the reason an
        operator wrote, and the cost sentence that ships with the binary — the operator
        writes why they said yes, and the software says what they said yes to.

        **Authenticated, unlike the entry names on `/v1/health`.** The rule is plan
        section 10's: an unauthenticated endpoint may report what the process *enforces*
        and never what is stored. Which entries are active is enforcement; the reason is
        prose about somebody's environment.

        Always present, and an empty array is the ordinary answer. A route that
        disappeared when nothing was on would make "this deployment turned nothing on"
        and "this build has no surface mechanism" the same answer.
      responses:
        "200":
          description: The active entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surface"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuditUnavailable" }

  /v1/honeypots:
    get:
      x-surface-entry: honeypot_alert
      tags: [administration]
      summary: Which paths and tokens are bait, and what has been taken. Optional.
      description: |
        **Optional route.** It exists only in a build carrying the `honeypot_alert`
        surface entry (ADR-15, ADR-20). Against a default binary it answers `404` from
        the router's fallback, because off means *absent* rather than dormant — a handler
        that answered `404` from inside itself would be compiled, wired and one boolean
        from serving. `GET /v1/health` lists the entries an instance has, which is how a
        client learns this rather than inferring it from a status code.

        Requires `inspect` on the virtual path `sys/honeypots` (plan section 22).

        **This is the only place the honeypot flag is ever visible.** It does not appear
        on a secret read, in `GET /v1/list`, or in `GET /v1/versions`, because bait that
        announces itself to a caller is not bait — and an operator who cannot tell bait
        from a real secret eventually rotates it or builds a service on it, which
        destroys it just as thoroughly. `GET /v1/health` reports *that* a tripwire fired
        and never which bait was taken.
      responses:
        "200":
          description: Every piece of bait, and every trip that has not been cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Honeypots"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: This build does not carry the `honeypot_alert` entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/AuditUnavailable" }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        A ciphr token: `cph_` followed by an 8-character identifier and 43 characters
        of base64url. The `cph_` prefix is there so that secret scanners recognize an
        accidentally committed token.

  parameters:
    SecretPath:
      name: path
      in: path
      required: true
      description: |
        The normalized secret path. Segments joined by `/`, NFC-normalized, case
        sensitive. No empty segments, no `.` or `..`, no whitespace, no control
        characters, and no `*` — that character is reserved for policy patterns.
      schema:
        type: string
        examples: ["infra/service-a/DB_PASSWORD"]
    Version:
      name: version
      in: query
      required: false
      description: Which version. The current one if omitted. Versions start at 1.
      schema:
        type: integer
        format: int32
        minimum: 1

  responses:
    BadRequest:
      description: |
        The request could not be understood — an unparseable path, a reserved prefix, or
        a malformed body. The `detail` field describes the request; it never describes
        the configuration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: |
        No credential, or one that is not valid. Identical for a missing, malformed,
        unknown, expired, and revoked token: distinguishing them would tell a caller
        whether an identifier exists.
      headers:
        WWW-Authenticate:
          schema: { type: string, examples: ["Bearer"] }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        A valid identity that may not do this. Says nothing about the rule that refused
        — that is in the audit trail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        No such secret or version. A deleted version and one that never existed are
        both reported this way; the difference is in the audit trail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuditUnavailable:
      description: |
        The audit trail could not be written, so the request was refused. No secret was
        served and no change was made.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: A stable machine-readable code.
          enum:
            [
              unauthenticated,
              forbidden,
              not_found,
              bad_request,
              audit_unavailable,
              internal,
            ]
        message:
          type: string
          description: A fixed human-readable sentence.
        detail:
          type: string
          description: Present only where it describes the request rather than the server.

    Surface:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [entry, kind, accepted, reason, cost]
            properties:
              entry:
                type: string
                enum: [honeypot_alert]
                description: The entry name, as a configuration writes it.
              kind:
                type: string
                enum: [build, runtime]
                description: |
                  `build` means a Cargo feature absent from the default binary, chosen
                  where a deployment has to be able to prove the code is not *there*
                  rather than merely not called. `runtime` means composed at startup:
                  the route is never registered.
              accepted:
                type: string
                format: date
                description: The date the deployment accepted the cost.
                examples: ["2026-08-21"]
              reason:
                type: string
                description: |
                  Why this deployment wants it, in the operator's own words. The server
                  refuses to start on an active entry with no reason: a flag with none
                  beside it reads as an accident six months later, and the safest-looking
                  fix for an accident is the default.
              cost:
                type: string
                description: |
                  What the entry's absence would cost, from the record that owns it. Ships
                  with the binary rather than living in documentation.

    Honeypots:
      type: object
      required: [honeypots, open_trips]
      properties:
        honeypots:
          type: array
          description: Every piece of bait, secrets and tokens together.
          items:
            type: object
            required: [kind, tier, tripped]
            properties:
              kind:
                type: string
                enum: [secret, token]
              path:
                type: [string, "null"]
                description: The path, for a honeypot secret.
              token_id:
                type: [string, "null"]
                description: The non-secret identifier, for a honeypot token. Never the token.
              identity:
                type: [string, "null"]
                description: |
                  The identity a honeypot token was issued for. It grants nothing -- the
                  name is what says *which* bait was taken in the trail.
              tier:
                type: string
                enum: [alert]
                description: |
                  Only `alert` exists. ADR-15 designed `disable-identity` and `freeze` and
                  deliberately left them unbuilt; the store refuses any other value, so
                  this is the whole set rather than a subset of it.
              tripped:
                type: boolean
                description: Whether a trip on this bait is currently open.
        open_trips:
          type: array
          description: |
            Every trip that has not been cleared, newest first. One per piece of bait: a
            trip latches until an operator clears it on the host, so repeated reads of
            the same bait appear once here and once per read in the audit trail.
          items:
            type: object
            required: [tripped_at, kind, tier]
            properties:
              tripped_at:
                type: integer
                format: int64
                description: Milliseconds since the Unix epoch, UTC.
              kind:
                type: string
                enum: [secret, token]
              path: { type: [string, "null"] }
              token_id: { type: [string, "null"] }
              identity:
                type: [string, "null"]
                description: |
                  Who took it, when there was an authenticated identity. Null for a
                  honeypot token: presenting bait authenticates nothing, so there is
                  nobody to name.
              tier:
                type: string
                enum: [alert]

    Health:
      type: object
      required: [status, sealed, seal, key_source, audit_devices, surface, api_version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: |
            `ok`, or `degraded` when the process could not establish something it
            reports on -- see `degraded` for which part. `degraded` is not a liveness
            signal: the service is serving, and a load balancer must not pull it out of
            rotation for it. It is what a *monitor* branches on.
          examples: ["ok"]
        sealed:
          type: boolean
          description: |
            Whether the root key is unavailable. Always false in v1, which unseals at
            startup or refuses to start; the field exists because a split-key or HSM
            seal makes it meaningful, and a client should not have to change shape then.
        seal:
          type: string
          description: |
            The seal mechanism recorded in the store. `static` for a static key supplied
            from outside; `static_env` in stores sealed by a build from before the key
            could come from a file, which names the same mechanism.
          examples: ["static"]
        key_source:
          type: string
          enum: [env, file, supplied]
          description: |
            Where *this process* read its master key. Reported separately from `seal`
            because the two legitimately differ while a deployment moves from the
            environment to a file — which is exactly when an operator needs to see which
            one is in effect. Not secret: it names the source, never the key.
          examples: ["file"]
        audit_devices:
          type: array
          description: |
            The configured devices, in order, each with whether it accepted the most
            recent record. This is what makes "is the second device still working"
            answerable from outside the process: a device that refuses every write is
            otherwise invisible, because one accepting device is enough for a request
            to succeed.

            The reason a device gave is deliberately absent. This route is
            unauthenticated, and a device failure message names a path or a database.
          items:
            type: object
            required: [name, accepting]
            properties:
              name:
                type: string
                description: |
                  A stable label -- the device kind, numbered within that kind in
                  configuration order. **Deliberately not the configured path.** This
                  route is unauthenticated, and the location of the database or the
                  audit file is free reconnaissance for anyone who can reach the port;
                  withholding a device's failure *reason* for that exact argument while
                  publishing its path two fields away was a contradiction.

                  Numbered even when there is one device of that kind, so a rule keyed
                  on `file-1` does not break the day a second file device is configured.
                examples: ["sqlite-1", "file-1", "file-2"]
              accepting:
                type: boolean
                nullable: true
                description: |
                  Whether the device accepted the last record it was asked to store.
                  `null` until the first record is written -- "nothing recorded yet" is a
                  different state from "the last record was accepted", and a monitor that
                  conflates them reports a healthy device on a service that has never
                  written to it.

                  Frozen at `false` once the device is quarantined. From then on it is
                  not asked, so it appears in no failure list, and reporting `true` for a
                  device nobody is writing to would be the clearest possible way to hide
                  the situation.
              quarantined_from:
                type: integer
                minimum: 1
                description: |
                  The first sequence number this device is known to have missed. **Absent
                  for a device that is still being written to**, which is the ordinary
                  case.

                  A device that misses a committed record is stopped rather than written
                  to again: the chain is shared, so the next record it accepted would
                  carry a `prev_hash` naming a record that is not in it, and that file
                  would stop verifying at that point for good -- looking exactly like an
                  edited trail, produced by a volume that was briefly full.

                  **This is the field to alert on.** A deployment runs two devices so
                  that it has two copies; a value here means it has one, and the other is
                  frozen at whatever it held. `audit-trail.md` has the procedure for
                  bringing it back.

                  A number and never a reason -- a device failure message names a path,
                  and this route is unauthenticated.
        surface:
          type: array
          description: |
            Which optional surface entries this process is running (ADR-20). Names
            only, and an empty array is the ordinary answer -- every entry is off
            until a deployment names it in its configuration.

            Here rather than behind a token because *which entries are active* is what
            the process enforces, and an unauthenticated endpoint may report that. The
            date a deployment accepted the cost and the reason it wrote down are prose
            about somebody's environment, so they stay behind `inspect` on `sys/surface`.

            A monitor that cannot see the shape of the thing it monitors is watching a
            different system -- which is the whole reason this field is not authenticated.
          items:
            type: string
            enum: [honeypot_alert]
          examples: [[], ["honeypot_alert"]]
        tripped:
          type: boolean
          description: |
            Whether any tripwire is currently open (ADR-15). **Absent** in a build
            without the `honeypot_alert` entry, rather than `false`: "this build cannot
            detect bait" and "nothing has been taken" are different facts, and a monitor
            that conflates them reports a working tripwire on a service that has none.

            **Also absent when the store could not be asked**, with `tripwires` in
            `degraded` saying so. It used to answer `false` in that case, under
            `status: "ok"` -- an affirmative "nothing has been taken" from a process
            that could establish nothing of the kind, during the one event where the
            answer matters.

            A boolean and never a name. Plan section 10 lets an unauthenticated endpoint
            say what the process is doing, which is *that* something fired; *which* bait
            was taken is stored, and stays behind the administrative read and the trail.

            It does not clear itself. A trip is cleared on the host, deliberately -- a
            tripwire that resets on a timer has, in effect, not fired.
        degraded:
          type: array
          description: |
            What this process could not establish about itself, by name. **Absent when
            there is nothing to report**, which is the ordinary case, and the reason
            `status` reads `degraded` when it is present.

            It exists because `tripped` is already meaningfully absent: absent means
            "this build has no tripwire mechanism". A store failure borrowing that same
            absence would have made the two indistinguishable, so instead the absence
            keeps its meaning and this names the missing part.

            A name and never a reason -- a store error message names a database file,
            and this route is unauthenticated.
          items:
            type: string
            enum: [tripwires]
          examples: [["tripwires"]]
        open_tripwires:
          type: integer
          minimum: 0
          description: |
            How many trips are open. Absent under the same condition as `tripped`, and
            also absent when the store could not be asked -- in which case `degraded`
            carries `tripwires`. Absent rather than `0`: a count nobody could take is
            not a count of zero.

            More than one means more than one piece of bait, not more than one read of
            the same one: a trip latches per piece of bait until it is cleared.
        api_version: { type: string, examples: ["v1"] }

    SecretInput:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: The value, as UTF-8 text.
        rotation:
          type: string
          examples: ["rotatable", "breaks-data"]
          description: |
            The rotation class to record for this secret, as `Classification.class`
            names it.

            **Absent means unchanged**, which is what keeps the pessimistic default
            intact: a path written for the first time without this field lands
            `unclassified`, exactly as before. Naming it on an existing path is a
            reclassification and is audited as one — a `classify` entry beside the
            `write`, because a class that moved silently among the value writes is the
            one nobody sees moving down to `rotatable` before a rotation that destroys
            data.

            An unknown class is `400`. Unlike on the way out, where `class` is
            deliberately an open string so a client can carry one it does not know, an
            input is checked against the classes this service has: defaulting a typo to
            anything would turn it into a claim nobody made.

            No capability beyond `write` on the path. Naming what a value is safe for is
            not a broader privilege than setting the value, and the field is metadata
            that never reaches an authorization decision.

            The class in effect is **not** echoed in the response: it belongs to the
            secret rather than to the version that was just written, and
            `GET /v1/versions/{path}` is where it is read. That matters against a service
            older than this field, which ignores it in silence the way an unknown
            property always is — one version listing after the first import confirms the
            field arrived rather than a whole estate quietly staying `unclassified`.

    Secret:
      type: object
      required: [path, version, value, created_at, created_by]
      properties:
        path: { type: string }
        version: { type: integer, format: int32, minimum: 1 }
        value: { type: string }
        created_at:
          type: integer
          format: int64
          description: Milliseconds since the Unix epoch, UTC.
        created_by:
          type: string
          description: The identity that wrote this version.

    WriteResult:
      type: object
      required: [path, version]
      properties:
        path: { type: string }
        version: { type: integer, format: int32, minimum: 1 }

    History:
      type: object
      required: [path, rotation, versions]
      description: |
        An object rather than the bare array this returned before 2026-08-20. The
        rotation class belongs to the secret and not to any one version, so it has
        nowhere to live inside an array of versions — and a top-level JSON array
        cannot grow a field at all, which means the next piece of per-secret metadata
        would meet the same wall. The shape was changed once, while the consumers
        could be counted.
      properties:
        path: { type: string }
        rotation: { $ref: "#/components/schemas/Classification" }
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VersionSummary"

    Classification:
      type: object
      required: [class, needs_care, advice]
      description: |
        How safe the secret is recorded to be to rotate. Metadata only: it never
        influences an authorization decision, so a wrong classification is an
        operational problem and never an access-control one.

        `class` is open rather than a closed enum on purpose — a client that could not
        parse a class a later service added would break for a reason that has nothing
        to do with it. Decide on `needs_care` instead, which is the service's own
        answer to whether this should stop somebody; re-deriving it from the class name
        is right until the set of classes changes.
      properties:
        class:
          type: string
          examples: ["unclassified", "rotatable", "breaks-data"]
          description: |
            `unclassified` is the default and means nobody has said. It is not a claim
            that rotating is safe, and it counts as needing care.
        needs_care:
          type: boolean
          description: |
            Whether changing this value can destroy data or silently do nothing. True
            for every class except `rotatable`, including `unclassified`.
        advice:
          type: string
          description: |
            What to do instead of rotating blindly, in prose. Carried in the payload so
            that whatever shows it shows the same words the CLI prints at the same
            moment — a second copy in a client is a copy that drifts.

    VersionSummary:
      type: object
      required: [version, created_at, created_by, deleted, destroyed]
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        created_at: { type: integer, format: int64 }
        created_by: { type: string }
        deleted:
          type: boolean
          description: Soft-deleted, and restorable.
        destroyed:
          type: boolean
          description: |
            Crypto-shredded: the wrapped data key is gone, so the value cannot be
            recovered by anyone, including from a backup taken afterwards.

    Listing:
      type: object
      required: [prefix, paths, entries]
      properties:
        prefix: { type: string }
        paths:
          type: array
          items: { type: string }
          description: |
            The visible paths. Carries the same set in the same order as `entries`, and
            the duplication is compatibility rather than indecision: `ciphr-run` is
            bind-mounted into images this project does not own (ADR-14), so a wrapper on
            a host is routinely older than the service it calls. Turning this into a
            list of objects would break exactly that pair, at the moment a service is
            starting and its secrets are not there.
        entries:
          type: array
          items: { $ref: "#/components/schemas/ListedSecret" }
          description: |
            The same paths, each with its rotation class. Added in a later version than
            `paths`; a client that does not know the field ignores it.

    ListedSecret:
      type: object
      required: [path, rotation]
      properties:
        path: { type: string }
        rotation:
          type: string
          examples: ["unclassified", "rotatable", "seed-only"]
          description: |
            The rotation class as stored, and only the class. `needs_care` and `advice`
            are pure functions of it, so they are not repeated on every row of a
            listing — see `Classification`, which carries all three for one secret.

            Open rather than a closed enum, for the reason `Classification.class` gives:
            a client that could not parse a class a later service added would break for
            a reason that has nothing to do with it.

            This discloses nothing new. Every path here survived a `list` check, and
            `GET /v1/versions/{path}` returns the same class against the same
            capability — so the field saves a request per secret rather than opening a
            door.

    ExportRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { type: string }
          description: |
            The paths to export, named explicitly rather than by prefix: an export is
            the operation most likely to hand over more than intended.

            **At most 256, each named once.** Both are checked before the first
            authorization and before the first audit write, so a request that will not
            be served costs a parse and nothing else. Without the bound, one
            authenticated request could name a path ten thousand times and buy an
            authorization, a durable audit write, a store read and a decryption for
            every occurrence -- and a correcting audit write per path already
            processed if anything failed late.

            256 is generous rather than tight: a container's environment is a few dozen
            variables, and the fetching consumers name one path per variable. A
            deployment above it is fetching a prefix wide enough that it should say so
            in more than one request, and the refusal names the limit.

            A duplicate is **refused rather than deduplicated**. Asking twice for one
            secret is a caller bug, and returning fewer entries than were asked for is
            how such a bug reaches production. The comparison is on the parsed path, so
            two spellings of one path do not slip past it.

            The response is bounded too, at one mebibyte of values in total, counted as
            they are read. The request body limit says nothing about that when a short
            path names a large value.

    ExportResult:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            type: object
            required: [path, version, value]
            properties:
              path: { type: string }
              version: { type: integer, format: int32, minimum: 1 }
              value: { type: string }

    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"

    AuditEntry:
      type: object
      required: [seq, hash, record]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
        hash:
          type: string
          description: |
            SHA-256 of the stored record, as 64 hexadecimal characters. It is the hash
            of exactly the bytes in `record`, so a client can recompute it.
        record:
          $ref: "#/components/schemas/AuditRecord"

    AuditRecord:
      type: object
      description: |
        A record exactly as stored. The field order is the hashed form: recomputing the
        hash requires the original bytes, which is why this endpoint returns them rather
        than a rearranged view.
      required: [seq, ts, prev_hash, entry]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
        ts:
          type: string
          format: date-time
          description: RFC 3339, UTC, milliseconds.
        prev_hash:
          type: string
          description: The previous record's hash, or 64 zeroes for the first record.
        entry:
          type: object
          required: [action, allowed]
          properties:
            principal:
              type: [object, "null"]
              properties:
                name: { type: string }
                kind: { type: [string, "null"] }
                token_id:
                  type: [string, "null"]
                  description: The non-secret identifier of the token used. Never the token.
            action:
              type: string
              enum:
                [
                  read,
                  write,
                  delete,
                  list,
                  undelete,
                  init,
                  rotate-master-key,
                  audit-device-failed,
                  destroy,
                  classify,
                  issue-token,
                  revoke-token,
                  request-refused,
                  surface-active,
                  honeypot-triggered,
                  honeypot-marked,
                  honeypot-cleared,
                ]
            subject:
              type: [object, "null"]
              description: |
                Who or what the action was *about*, when that is not the actor. Set by
                `issue-token` and `revoke-token` and by nothing else so far: an operator
                on the host issues a credential **for** an identity, so `principal` is
                the operator and `subject` is the identity plus the token's non-secret
                id. That id is what joins the entry to every later access made with the
                credential.
              properties:
                name: { type: string }
                kind: { type: [string, "null"] }
                token_id: { type: [string, "null"] }
            path: { type: [string, "null"] }
            version: { type: [integer, "null"], format: int32 }
            allowed: { type: boolean }
            deny_reason:
              type: [string, "null"]
              enum: [unknown-identity, no-matching-rule, not-granted, tie, unauthenticated, not-found, write-failed, delete-failed, not-listed, not-served, classify-failed, revoke-failed, malformed-path, malformed-export, unmatched-route, unmatched-method, null]
              description: |
                Stable labels, except for `audit-device-failed` entries, whose reason is
                `device-refused: <device name>` so a later reader can tell which copy of
                the trail has a gap.

                `honeypot-triggered` carries `unauthenticated` when the bait was a token
                and no reason at all when it was a secret -- reading bait an identity was
                authorized to read is not a denial. `latch-failed` marks the one case
                where a trip was recorded and its latch was not, which means
                `/v1/health` may not show it.

                `request-refused` carries `malformed-path`, `malformed-export`,
                `unmatched-route` or `unmatched-method`: an authenticated caller was
                turned away before any decision was reached, so there is no rule and no
                path on the entry. **The input is not echoed into it** -- the malformed
                part is exactly what the caller controls, and the trail is the artefact
                this project keeps tamper-evident. `detail` says what they were
                attempting.

                `not-found`, `write-failed`, `delete-failed`, `not-listed`, and
                `not-served` mark a **correcting second entry**: the decision above them
                said an operation was allowed, and this one says it did not happen. They
                are not denials. On `POST /v1/export` a failure corrects every path the
                request had already recorded, because none of those values left the
                process either.
            rule:
              type: [object, "null"]
              properties:
                policy: { type: string }
                pattern: { type: string }
            results:
              type: [integer, "null"]
              format: int32
              description: |
                How many items an operation returned, for operations that authorize per
                returned item rather than through one decision. Set by listing and null
                everywhere else.

                Its presence marks the entry as *not* carrying an authorization
                decision, which is why `rule` is null on those entries and why `allowed`
                there means "the operation ran" rather than "a rule permitted it". The
                names are deliberately absent: an entry that grew with the size of a
                listing would make records unbounded.
            detail:
              type: [string, "null"]
              description: |
                What an informational entry is about, when no path and no identity say
                it. Set by `surface-active`, which carries the comma-separated names of
                the active surface entries or the literal `none`, and by
                `honeypot-triggered`, which carries `attempted: <action>` -- the action
                the entry would have had if the credential or the path had not been bait.

                `honeypot-marked` carries `marked` or `unmarked`. Both directions share
                one action because both are the same event seen from either side, and the
                trail has to be able to answer "was this bait on the day it was read".
                Null everywhere else.

                **Not a second `deny_reason`.** A `surface-active` entry refuses
                nothing, so `deny_reason` there would make the trail claim a denial that
                never happened -- the same confusion the correcting entries of `0.4.0`
                had to be documented against. `audit-device-failed` keeps naming its
                device in `deny_reason` and is right to: a device refused.

                New in this release, so records written by an older build do not carry
                the key at all. Present as `null` from here on rather than omitted,
                which is the rule the whole record follows: a reader years later can
                tell "not applicable" from "this version did not record it".
            request:
              type: object
              properties:
                request_id: { type: [string, "null"] }
                client_ip: { type: [string, "null"] }
                user_agent: { type: [string, "null"] }
                http_status: { type: [integer, "null"] }
                channel:
                  type: [string, "null"]
                  description: |
                    The channel a request arrived through. Set to `mcp` by the MCP
                    server, so that what flowed into a model context stays
                    distinguishable from what a human read.

    Identities:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items:
            type: object
            required: [name, kind, policies]
            properties:
              name: { type: string }
              kind: { type: string, enum: [machine, human] }
              policies:
                type: array
                items: { type: string }

    Policies:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items:
            type: object
            required: [name, rules]
            properties:
              name: { type: string }
              rules:
                type: array
                items:
                  type: object
                  required: [path, capabilities, specificity]
                  properties:
                    path: { type: string }
                    capabilities:
                      type: array
                      items:
                        type: string
                        enum: [read, write, delete, list, undelete, inspect, revoke]
                      description: An empty array is an explicit denial.
                    specificity:
                      type: integer
                      description: |
                        Literal segments in the pattern. The most specific matching rule
                        wins entirely and inherits nothing from broader rules.
