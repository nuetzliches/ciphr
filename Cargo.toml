[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version      = "0.10.0"
edition      = "2024"
rust-version = "1.94"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/nuetzliches/ciphr"
# The project is private and nothing here is release-ready. Publishing is a
# deliberate future decision, not something that should happen by accident.
publish      = false

# Lint policy for the whole workspace. Every crate opts in with
# `[lints] workspace = true`; CI runs clippy with `-D warnings`, so everything
# below is blocking. See docs/security-guidelines in AGENTS.md.
# Every entry here is a reviewed decision, and the reason is part of the
# entry. The budget is tightest in ciphr-crypto and ciphr-policy, which take
# nothing beyond what is listed as cryptographic.
[workspace.dependencies]
ciphr-audit  = { path = "crates/ciphr-audit" }
ciphr-core   = { path = "crates/ciphr-core" }
ciphr-crypto = { path = "crates/ciphr-crypto" }
ciphr-policy = { path = "crates/ciphr-policy" }
ciphr-sdk    = { path = "crates/ciphr-sdk" }
ciphr-store  = { path = "crates/ciphr-store" }
# Only ever a dev-dependency, so that `ciphr-sdk` and `ciphr-run` can be tested against
# the real service over a real TLS socket rather than against a mock of it.
ciphr-server = { path = "crates/ciphr-server" }

# AEAD. Default features are off so that nothing arrives unasked; `zeroize`
# makes the crate wipe its own key schedule, which is the point of using it.
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc", "zeroize"] }
# The OS CSPRNG, which is what `rand::rngs::OsRng` wraps. Taken directly so that
# no userspace PRNG exists in the dependency graph at all — a deterministic RNG
# cannot be reached by accident if it is not there.
getrandom = "0.4.3"
# Secret wrappers whose types implement neither Debug, Display nor Serialize.
secrecy = "0.10.3"
zeroize = { version = "1.9.0", features = ["alloc"] }
# Unicode NFC for path normalization: two encodings of the same path must not
# become two different secrets.
unicode-normalization = "0.1.25"
# SQLite, statically linked (`bundled`) so the version is pinned by Cargo rather
# than by whatever the host image happens to ship.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# TOML and typed deserialization. These are the dependencies ADR-2 chose when it
# rejected a custom policy DSL: the alternative is a hand-written parser in the
# authorization path, where a parser bug is an authorization bypass. Deriving the
# schema also gets `deny_unknown_fields` for free, so a typo in a policy file is
# an error rather than a silently ignored line.
serde = { version = "1.0.228", features = ["derive"] }
toml  = "1.1.4"

# Hashing, for the audit chain and for token verifiers.
sha2 = "0.11.0"
# HMAC, for the peppered token verifier. A single-step KDF for the pepper as well:
# a token is 256 bits of randomness, so password hashing would cost CPU on every
# request and buy nothing (there is no dictionary to attack).
hmac = "0.13.0"
# Constant-time comparison. Token, HMAC, and tag comparisons must not leak where
# they differ.
subtle = "2.6.1"
# JSON, for the audit payload. The bytes that are hashed are the bytes that are
# stored, so verification never re-serializes anything.
# `raw_value` is what lets the audit endpoint hand back the exact bytes that were
# hashed instead of a re-serialization of them. See crates/ciphr-server/src/api.rs.
serde_json = { version = "1.0.145", features = ["raw_value"] }

# The HTTP stack, kept narrow (ADR-9). A well-tested router matters here because
# authorization is path-based: any divergence between routing normalization and
# policy normalization is an authorization bypass. `tower-http` is deliberately
# absent — each middleware layer is a separate decision with its own reason.
axum   = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio  = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
# TLS terminates at the listener, not at the reverse proxy (ADR-8).
axum-server    = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls         = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

# Argument parsing for the CLI. Hand-rolled parsing in a tool that handles secrets
# is the same class of mistake as hand-rolled routing: it is the boring code where an
# edge case turns into the wrong path or the wrong flag being honoured.
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "wrap_help"] }

# The HTTP *client*, for `ciphr-sdk` (ADR-19). Blocking, because the call it makes is
# one fetch at startup and a runtime in every consuming application is a price with
# nothing behind it. `rustls-no-provider` is the substance of the choice rather than a
# size saving: it pulls in no `webpki-roots`, so a client that trusts the public CA set
# cannot be built at all — the machine path pins on this deployment's own CA (ADR-17),
# and ureq refuses at build time rather than trusting something wider by default.
# HTTP/1.1 framing is `httparse`, the same parser hyper uses; the alternative was a
# hand-written one in the process that holds plaintext.
ureq = { version = "3.4.0", default-features = false, features = ["rustls-no-provider"] }

# Test-only.
proptest = "1.11.0"
tempfile = "3.24.0"
tower    = { version = "0.5.3", features = ["util"] }
# X.509 generation, for tests only. The end-to-end test of `ciphr-sdk` needs a real
# certificate for a real handshake, and the alternative was a checked-in key pair --
# which is test fixture material that looks like real key material, the one thing
# AGENTS.md rules out. `rustls`'s own sibling project, and it reuses the `ring`
# provider already in the graph rather than adding a second one.
rcgen = { version = "0.14.9", default-features = false, features = ["pem", "ring"] }

[workspace.lints.rust]
missing_docs          = "warn"
unreachable_pub       = "warn"
unused_qualifications = "warn"

# Deliberately NOT enabled: `missing_debug_implementations`. Secret-bearing
# types must not implement `Debug` (ADR-1), and a lint that nudges towards
# adding it works against the central guarantee of this project.

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Allowed with a reason, not because they were inconvenient:
#
# `must_use_candidate` would put an attribute on every getter in the workspace.
# The case that actually matters — ignoring a `Result` — is already caught by
# rustc's own `unused_must_use`.
must_use_candidate = "allow"
