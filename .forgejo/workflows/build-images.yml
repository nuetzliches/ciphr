# Builds the container images and pushes them to the Forgejo registry.
#
# Two images, from one tag: the service, and `ciphr-run` as the only file in an
# image of its own (`Dockerfile.run`). The second one is here for exactly the
# reason the first one is -- the wrapper is bind-mounted into images this project
# does not own, so a deployment needs the file, and the release asset that
# carries it on GitHub is unreadable to a host that cannot authenticate there.
#
# ── Why this file exists at all ───────────────────────────────────────────────
# `.github/workflows/release.yml` already builds both and pushes them to GHCR.
# That is the intended home. This file is a **temporary duplicate** for one
# reason: the repository is private, so its GHCR package is private too, and the
# deployment host has no GHCR credentials -- it authenticates to
# `git.nuetzliche.it` and nothing else.
#
# The alternative was making the GHCR package public while the source stays
# private. That was considered and rejected: publishing the artefact of an
# unreviewed cryptographic implementation invites someone to run it, and plan
# section 18 makes the external review a precondition for production use --
# which is a property of the software, not of one deployment. A public image
# from a private repository is also unauditable, which is the posture this
# project rejects everywhere else.
#
# **The review happened on 2026-08-21, and it does not unblock that.** Stated
# here because the inference is short and wrong: the reasoning above turns on
# the word `unreviewed`, so a reader who knows the gate fell concludes the
# package can go public. It cannot, for two reasons that survive the review.
# The acceptance in `docs/security-review.md` says in its own words that making
# this repository public *as something others are invited to run* raises the bar
# back to a human review, and the review of 2026-08-21 was performed by an AI
# model. And the second sentence never mentioned the review at all: a public
# image from a private repository is unauditable whatever its provenance.
#
# **Delete this file once the repository is public.** Then the GHCR package can
# be public too, `release.yml` is the single publisher again, and the deployment
# pulls from there. Note that the condition is the repository going public --
# not the review, and not this comment.
#
# ── What this workflow does NOT do ────────────────────────────────────────────
# It does not run the test suite, and it cannot: the gates live in
# `.github/workflows/ci.yml` and run on GitHub, where the tag is pushed first.
# `release.yml` calls them before building; nothing here can.
#
# The consequence is a rule rather than a mechanism: **a tag produces an image
# here whether or not GitHub's run was green.** The GitHub run is the gate. Do
# not bump `CIPHR_TAG` in the deployment until it has passed.
name: Build and push to the Forgejo registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build, e.g. v0.1.0. Required -- there is no latest."
        type: string
        required: true

env:
  REGISTRY: git.nuetzliche.it
  IMAGE: git.nuetzliche.it/nuts/ciphr

jobs:
  image:
    name: Build and push
    runs-on: baumeister-runner
    steps:
      # No `uses:` anywhere in this infrastructure: the runner has no node, so
      # every step is a shell step and the checkout is a plain clone. The token
      # is injected by Forgejo.
      - name: Check out the tag
        run: |
          set -eu
          case "${{ github.ref }}" in
            refs/tags/*) version="${{ github.ref }}"; version="${version#refs/tags/}" ;;
            *)           version="${{ github.event.inputs.version }}" ;;
          esac
          if [ -z "$version" ]; then
            echo "no version: this workflow builds tags, never a branch tip" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

          # Full clone with tags. A shallow one cannot check out a tag reliably,
          # and the saving is irrelevant for a repository this size.
          git clone "https://oauth2:${GITHUB_TOKEN}@${REGISTRY}/nuts/ciphr.git" workspace
          cd workspace
          git checkout "tags/${version}"
          echo "built from $(git rev-parse HEAD)"

      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${REGISTRY_PASSWORD:-}" ]; then
            echo "REGISTRY_PASSWORD is empty. Forgejo keeps secrets and variables in" >&2
            echo "separate namespaces, and a value stored as a variable is invisible" >&2
            echo "to secrets.*. It also has to be visible in THIS repository's scope," >&2
            echo "so set it organisation-wide or add it here." >&2
            exit 1
          fi
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      # ── Both images are built before either is pushed ────────────────────────
      # The order is the whole point, and it is not the order this had. Building
      # the service image, pushing it, and then building the wrapper is how
      # `v0.6.0` came to exist as one image and not the other: `Dockerfile.run`
      # copied a path the build no longer produced, and by the time that failed
      # the service image was already in the registry under a tag that must not
      # move. This registry is the one a deployment pulls from, so it saw the same
      # half-published version -- `nuts/ciphr:0.6.0` exists here and
      # `nuts/ciphr/run:0.6.0` does not, which is how the failure was confirmed
      # rather than assumed (`docs/field-report-2026-08-22.md`, finding 5).
      #
      # `release.yml` answers this with a job that builds the wrapper image and
      # pushes nothing, which both publishing jobs wait for. Here it is cheaper
      # than that: one job, so the two builds are simply both done first and the
      # pushes follow. No second build, no cache to warm, and nothing reaches the
      # registry until the pair exists locally.
      #
      # One tag each, and deliberately no `:latest`. The service is the one thing
      # in the fleet that can read every secret in it; an image reference that can
      # move under the deployment's feet is exactly what it must not have. For the
      # wrapper the reason is sharper still: this file gets mounted into
      # containers built by other people, and a tag that can move is a way to
      # change those bytes without anything recording that it happened.
      #
      # `Dockerfile.run` runs `ci/build-wrapper.sh` in its builder stage, so the
      # static-linkage check and the size budget are enforced here as well -- this
      # runner needs no Rust toolchain of its own for that to hold.
      - name: Build both images, pushing neither
        run: |
          set -eu
          cd workspace
          revision=$(git rev-parse HEAD)

          docker build \
            --label "org.opencontainers.image.source=https://github.com/nuetzliches/ciphr" \
            --label "org.opencontainers.image.version=${VERSION#v}" \
            --label "org.opencontainers.image.revision=$revision" \
            -t "${IMAGE}:${VERSION#v}" \
            .

          docker build \
            -f Dockerfile.run \
            --label "org.opencontainers.image.source=https://github.com/nuetzliches/ciphr" \
            --label "org.opencontainers.image.version=${VERSION#v}" \
            --label "org.opencontainers.image.revision=$revision" \
            -t "${IMAGE}/run:${VERSION#v}" \
            .

      # Only now, and both. A failure here leaves a tag half-published the way the
      # old order did -- but a push failing after its image built is a registry or
      # credential problem, not a build that was never going to work, and that is
      # the failure this cannot design away.
      - name: Push both
        run: |
          set -eu
          docker push "${IMAGE}:${VERSION#v}"
          docker push "${IMAGE}/run:${VERSION#v}"

      # The checksum of the file this image carries, taken the same way a
      # deployment takes it: create a container, copy the file out, never start
      # it. `docker cp` reads the filesystem of a created container, which is why
      # an image with no shell is no obstacle.
      #
      # **This number belongs to this build.** GitHub's release asset comes from
      # a second, independent build of the same commit, and while both pin the
      # same base image digest and the same locked dependency graph, neither
      # build is claimed to be reproducible -- `apt-get` resolves whatever the
      # archive currently offers, here as in `Dockerfile`. Verify against the
      # checksum published by the channel the file was pulled from, not the other
      # one.
      - name: Report the wrapper checksum
        run: |
          set -eu
          # This runner is persistent, so a container left behind by a failed run
          # would collide on the name and fail this one for the wrong reason.
          docker rm -f ciphr-run-export >/dev/null 2>&1 || true
          docker create --name ciphr-run-export "${IMAGE}/run:${VERSION#v}"
          docker cp ciphr-run-export:/ciphr-run ./ciphr-run
          docker rm ciphr-run-export
          sha256sum ciphr-run > ciphr-run.sha256
          echo "WRAPPER_SHA=$(cut -d' ' -f1 ciphr-run.sha256)" >> "$GITHUB_ENV"

      - name: Report what was pushed
        run: |
          set -eu
          cd workspace
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION#v}" 2>/dev/null || echo "unknown")
          wrapper_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}/run:${VERSION#v}" 2>/dev/null || echo "unknown")
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION#v}"
            echo "$digest"
            echo
            echo "${IMAGE}/run:${VERSION#v}"
            echo "$wrapper_digest"
            echo "ciphr-run  sha256:${WRAPPER_SHA}"
            echo '```'
            echo
            echo "The deployment pins this by tag in \`.env.example\`."
            echo "Do not bump it until the GitHub CI run for \`${VERSION}\` is green --"
            echo "this workflow does not check that and cannot."
          } >> "$GITHUB_STEP_SUMMARY"
