[package]
name = "ciphr-server"
description = "HTTP API server for ciphr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ciphr-audit.workspace  = true
ciphr-core.workspace   = true
ciphr-crypto.workspace = true
ciphr-policy.workspace = true
ciphr-store.workspace  = true
axum.workspace           = true
axum-server.workspace    = true
rustls.workspace         = true
serde.workspace          = true
serde_json.workspace     = true
tokio.workspace          = true
toml.workspace           = true

# Surface entries of the build kind (ADR-20): a Cargo feature, absent from the
# default build, chosen where a deployment has to be able to prove the code is not
# there rather than merely not called. Nothing here is on by default, and there is
# deliberately no `default = [...]` line -- a default that turns surface on is the
# thing this mechanism exists to prevent.
#
# `honeypot_alert` is ADR-15's `alert` tier. The severe tiers are designed and not
# built, so they are not features: optionality by not writing the code.
[features]
honeypot_alert = []

[dev-dependencies]
# `rusqlite` for one assertion and no production use: `tests/check_config.rs` winds a
# store's schema version back to check that `--check-config` does not migrate it. Nothing
# in `ciphr-store`'s interface can express "an older store", and the claim -- that a
# pre-flight check cannot spend the rollback a pre-upgrade backup exists to keep -- is
# worth a test rather than a sentence.
rcgen.workspace    = true
rusqlite.workspace = true
tempfile.workspace = true
tower.workspace    = true

[lints]
workspace = true
