[package]
name = "ciphr-cli"
description = "Command-line interface for ciphr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ciphr-audit.workspace  = true
ciphr-core.workspace   = true
ciphr-crypto.workspace = true
# The export formats, shared with `ciphr-ci` (ADR-25). The rendering rules -- above all
# the masking order and the heredoc delimiter -- are the half of an export that must be
# identical in both binaries, and the way to keep two implementations identical is not
# to have two. This is also where `getrandom` moved to: the delimiter needs it, and this
# crate no longer does.
ciphr-export.workspace = true
ciphr-policy.workspace = true
ciphr-store.workspace  = true
clap.workspace         = true
serde.workspace        = true
serde_json.workspace   = true
# For `ciphr surface show`, which reads the `[[surface]]` stanzas out of a server
# configuration on the host. Nothing new in the dependency graph: `ciphr-policy` is
# already a dependency here and already takes `toml` (ADR-2), so this declares a crate
# that is compiled either way rather than adding one.
#
# Read loosely rather than through the server's typed `Config`: depending on
# `ciphr-server` would drag axum, rustls and a tokio runtime into a host tool, and
# redefining the schema here would mean two definitions of the thing that decides whether
# the service starts.
toml.workspace         = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# The user-facing command is `ciphr`; the crate name carries the `-cli` suffix
# so it does not collide with a future facade crate named `ciphr`.
[[bin]]
name = "ciphr"
path = "src/main.rs"
