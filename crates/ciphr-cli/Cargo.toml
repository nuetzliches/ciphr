[package]
name = "ciphr-cli"
description = "Command-line interface for ciphr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ciphr-audit.workspace  = true
ciphr-core.workspace   = true
ciphr-crypto.workspace = true
ciphr-policy.workspace = true
ciphr-store.workspace  = true
clap.workspace         = true
serde.workspace        = true
serde_json.workspace   = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# The user-facing command is `ciphr`; the crate name carries the `-cli` suffix
# so it does not collide with a future facade crate named `ciphr`.
[[bin]]
name = "ciphr"
path = "src/main.rs"
